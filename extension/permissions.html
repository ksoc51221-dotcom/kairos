<!doctype html>
<meta charset="utf-8">
<title>Kairos: allow camera and microphone</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="lib/kairos.css">
<style>
  body { display: grid; place-items: center; min-height: 100vh; padding: 24px; }
  main { width: min(440px, 100%); padding: 28px 0 0; border-top: 1px solid var(--hair-strong); }
  main > * { animation: i-rise var(--t-smooth) var(--ease) both; animation-delay: calc(var(--i, 0) * 30ms); }
  .brand { margin-bottom: 28px; }
  h1 { margin: 0 0 6px; font: 600 18px/24px var(--sans); }
  p { margin: 0 0 20px; color: var(--ink-2); font-size: 14px; line-height: 22px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .state { margin: 0 0 20px; padding: 10px 12px; border-radius: var(--r-btn); border: 1px solid var(--hair-strong); font: 400 13px/18px var(--sans); color: var(--ink); }
  .state.bad { border-color: var(--alert); color: var(--alert); }
  .state.good { border-left: 2px solid var(--ink); }
</style>
<main>
  <div class="brand" style="--i:0"><span data-icon="kairos"></span><span class="wm">Kairos</span></div>
  <h1 id="title" style="--i:1">Allow camera and microphone</h1>
  <p id="why" style="--i:2" title="Your browser asks once. Nothing is uploaded.">Asked once. Recorded on this device only.</p>
  <div id="state" class="state" hidden></div>
  <div class="actions" style="--i:3">
    <button class="btn primary" id="again">Allow access</button>
    <button class="btn" id="nomic" hidden>Record without microphone</button>
    <button class="btn" id="settings" hidden>Open site settings</button>
    <button class="btn" id="close" hidden>Close this tab</button>
  </div>
</main>
<script src="lib/icons.js"></script>
<script src="permissions.js"></script>
