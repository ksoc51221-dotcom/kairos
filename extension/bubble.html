<!doctype html>
<meta charset="utf-8">
<title>Kairos camera</title>
<style>
  html, body { margin: 0; height: 100%; background: #0B0B0C; overflow: hidden; }
  video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: block; }
  p { position: absolute; inset: 0; display: none; place-items: center; margin: 0; padding: 14%; text-align: center; font: 500 10.5px/16px "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .1em; text-transform: uppercase; color: #A3A3A8; }
  body.err p { display: grid; }
  body.err video { display: none; }
</style>
<video id="v" autoplay muted playsinline></video>
<p id="msg" title="Allow it from the Kairos toolbar icon.">Camera is off</p>
<script src="bubble.js"></script>
