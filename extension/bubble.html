<!doctype html>
<meta charset="utf-8">
<title>Kairos camera</title>
<style>
  html, body { margin: 0; height: 100%; background: #0f172a; overflow: hidden; }
  video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: block; }
  p { position: absolute; inset: 0; display: none; place-items: center; margin: 0; padding: 14%; text-align: center; font: 600 13px/1.35 -apple-system, BlinkMacSystemFont, sans-serif; color: #94a3b8; }
  body.err p { display: grid; }
  body.err video { display: none; }
</style>
<video id="v" autoplay muted playsinline></video>
<p id="msg">Camera is off. Allow it from the Kairos toolbar icon.</p>
<script src="bubble.js"></script>
