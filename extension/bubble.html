<!doctype html>
<meta charset="utf-8">
<title>Kairos camera</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  html { background: #0B0B0C; }
  body { background-color: #0B0B0C; }
  video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: block; }
  p { background-color: #0B0B0C; position: absolute; inset: 0; display: none; place-items: center; margin: 0; padding: 14%; text-align: center; font: 500 13px/18px "Geist", ui-sans-serif, system-ui, -apple-system, sans-serif; color: #F2F2EE; }
  body.err p { display: grid; }
  body.err video { display: none; }
</style>
<video id="v" autoplay muted playsinline></video>
<p id="msg" title="Allow it from the Kairos toolbar icon.">Camera is off</p>
<script src="bubble.js"></script>
