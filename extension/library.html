<!doctype html>
<meta charset="utf-8">
<title>Kairos recordings</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="lib/kairos.css">
<link rel="stylesheet" href="library.css">
<body>
  <header class="top">
    <a class="brand" href="#/"><span data-icon="kairos"></span><span class="wm">KAIROS</span></a>
    <span class="summary meta" id="summary"></span>
    <span class="seg" role="group" aria-label="View"><button id="viewRows" aria-pressed="true">ROWS</button><button id="viewGrid" aria-pressed="false">GRID</button></span>
  </header>

  <main id="listView">
    <section class="welcome" id="welcome" hidden>
      <h1>Kairos is ready</h1>
      <p class="lead" title="Chrome keeps extensions out of its own pages (New Tab, chrome:// pages, the Web Store). Pin Kairos to your toolbar for the same three choices there. Your browser asks for camera and microphone access once; everything stays on this device.">Look at the bottom left of any website.</p>
      <div class="demo" aria-hidden="true">
        <span class="demo-pill" title="Records your screen with a camera bubble. Drag the dots on its left to move it."><span data-icon="kairos"></span></span>
        <span class="demo-hint label">Hover to reveal</span>
        <span class="demo-orb off" data-icon="power" title="Hides Kairos on that site"></span><span class="demo-orb" data-icon="person" title="Camera only"></span><span class="demo-orb" data-icon="monitor" title="Screen only"></span>
      </div>
      <div class="row-actions"><button class="btn primary" id="tryit"><span data-icon="video"></span> Show me the button</button><button class="btn" id="setup" title="Your browser asks once. Everything stays on this device."><span data-icon="mic"></span> Allow camera and mic</button><button class="btn" id="dismiss">Not now</button></div>
    </section>

    <h1 class="h" id="heading">Recordings</h1>
    <div class="empty" id="empty" hidden title="Press the Kairos button on any website, or use the toolbar icon.">
      <span class="empty-glyph" data-icon="film"></span>
      <p class="label">No recordings · 00</p>
    </div>
    <div class="list" id="grid"></div>
    <p class="storage label" title="Recordings are stored in this browser only. Clearing site data for this extension or removing it deletes them, so download the ones you want to keep.">Stored in this browser only · download what you keep</p>
    <a class="promo label" href="https://github.com/ksoc51221-dotcom/kairos/releases/latest" target="_blank" rel="noopener" title="Records other apps, blurs secrets and writes AI notes, all on your own computer.">Kairos for Mac <span data-icon="external"></span></a>
  </main>

  <main id="playerView" hidden>
    <a class="back label" href="#/">&larr; All recordings</a>
    <div class="stage"><video id="video" controls playsinline></video></div>
    <div class="meta-wrap">
      <input id="title" class="title-input" aria-label="Title" maxlength="120">
      <div class="meta-line meta" id="metaLine"></div>
      <div class="row-actions">
        <button class="btn primary" id="download"><span data-icon="download"></span> Download</button>
        <button class="btn danger" id="delete"><span data-icon="trash"></span> Delete</button>
      </div>
    </div>
  </main>

  <script src="lib/core.js"></script>
  <script src="lib/icons.js"></script>
  <script src="lib/db.js"></script>
  <script src="library.js"></script>
</body>
