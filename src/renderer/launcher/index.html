<!doctype html>
<html data-skin="loom"><head><meta charset="utf-8"><title>Hermes</title>
<link rel="stylesheet" href="../../shared/ui.css"><link rel="stylesheet" href="launcher.css"></head>
<body>
<main id="wrap">
  <div id="notice" hidden>
    <div id="perm" class="warn" hidden><b>Hermes can't see your screen yet</b><p id="permtxt"></p><div class="pr"><button id="permopen" class="chip">Open Settings</button><button id="permre" class="chip">Restart Hermes</button></div></div>
    <div id="ready" class="warnbox" hidden><span id="readyText"></span> <button id="readyBtn" class="link" hidden></button></div>
  </div>
  <div id="pop" hidden><div id="popBody"></div><i id="arrow"></i></div>
  <nav id="bar">
    <button id="x" class="ib" data-tip="Close  Esc" data-icon="x"></button>
    <div id="src">
      <button data-s="screen" data-tip="Full screen" data-icon="laptop"></button>
      <button data-s="window" data-tip="Window" data-icon="window-bar"></button>
      <button data-s="custom" data-tip="Custom area" data-icon="dashed"></button>
      <button data-s="camera" data-tip="Camera only" data-icon="portrait-cam"></button>
    </div>
    <div class="grp" id="camG"><button id="camBtn" class="ib" data-tip="Camera"></button><button id="camCaret" class="caret" data-tip="Choose camera" data-icon="chevron-up"></button></div>
    <div class="grp" id="micG"><button id="micBtn" class="ib" data-tip="Microphone"><i id="lvl"></i><span id="micIcon"></span></button><button id="micCaret" class="caret" data-tip="Choose microphone" data-icon="chevron-up"></button></div>
    <button id="lock" class="ib" data-tip="This video is Public"></button>
    <button id="more" class="ib" data-tip="More" data-icon="more"></button>
    <button id="agent" class="ib" data-tip="Record for agent" data-icon="agent"></button>
    <button id="start" data-tip="Start recording"><span id="startSpin" class="spinner" hidden></span><span id="startIcon" data-icon="hermes"></span><span id="startLabel">Record</span></button>
  </nav>
</main>
<script src="../../shared/constants.js"></script>
<script src="../../shared/icons.js"></script>
<script src="launcher.js"></script>
</body></html>
