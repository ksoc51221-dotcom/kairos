<!doctype html>
<html data-skin="loom"><head><meta charset="utf-8"><title>Spool countdown</title>
<link rel="stylesheet" href="../../shared/ui.css"><link rel="stylesheet" href="countdown.css"></head>
<body>
<main id="stage">
  <button id="cancel" class="side" title="Cancel" aria-label="Cancel recording" data-icon="x"></button>
  <div id="wrap">
    <svg id="ring" viewBox="0 0 100 100" aria-hidden="true"><circle class="track" cx="50" cy="50" r="48.5"/><circle class="arc" id="arc" cx="50" cy="50" r="48.5" pathLength="100"/></svg>
    <div id="disc"><span id="n">3</span></div>
  </div>
  <button id="skip" class="side" title="Start now" aria-label="Start recording now" data-icon="skip"></button>
</main>
<p id="tip" class="tip"></p>
<script src="../../shared/icons.js"></script>
<script src="countdown.js"></script>
</body></html>
