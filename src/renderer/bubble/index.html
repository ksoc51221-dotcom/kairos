<!doctype html>
<html data-skin="loom"><head><meta charset="utf-8"><title>Kairos camera</title>
<link rel="stylesheet" href="../../shared/ui.css"><link rel="stylesheet" href="bubble.css"></head>
<body>
<div id="cam"><video id="v" autoplay muted playsinline></video><div id="sel"><div id="selbox"></div></div><div id="ret"></div>
  <div id="zbar"><button id="zin" class="zb" title="Zoom into part of the camera picture"><i data-icon="zoom-in"></i><span id="zinL">Zoom</span></button><button id="zout" class="zb" title="Back to the whole picture">Exit zoom</button></div></div><div id="ring"></div><div id="hold"></div><div id="toast"></div>
<div id="panel">
  <div id="main">
    <div id="sizeRow"><input id="size" type="range" min="120" max="420" step="2" value="260" aria-label="Size"></div>
    <div id="row2">
      <button id="styl" class="ib" title="Filters and frames" data-icon="sliders"></button>
      <div id="shapes">
        <button data-v="squircle" title="Rounded square" data-icon="squircle"></button><button data-v="circle" title="Circle" data-icon="circle"></button><button data-v="landscape" title="Landscape" data-icon="landscape"></button><button data-v="portrait" title="Portrait" data-icon="portrait"></button>
      </div>
      <button id="power" class="ib" title="Turn camera off" data-icon="power"></button>
    </div>
  </div>
  <div id="style" hidden>
    <div class="ph"><button id="back" class="ib" data-icon="chevron-left" title="Back"></button><b>Filters and frames</b></div>
    <div class="pick"><span>Filter</span><button data-a="filter" data-v="prev" class="ib" data-icon="chevron-left"></button><em id="bFilter"></em><button data-a="filter" data-v="next" class="ib" data-icon="chevron-right"></button></div>
    <div class="pick"><span>Frame</span><button data-a="frame" data-v="prev" class="ib" data-icon="chevron-left"></button><em id="bFrame"></em><button data-a="frame" data-v="next" class="ib" data-icon="chevron-right"></button></div>
  </div>
</div>
<script src="../../shared/constants.js"></script>
<script src="../../shared/icons.js"></script>
<script src="../../shared/gestures.js"></script>
<script src="../../shared/zoom.js"></script>
<script src="bubble.js"></script>
</body></html>
