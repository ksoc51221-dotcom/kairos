<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;height:100%;background:transparent;font-family:-apple-system,BlinkMacSystemFont,sans-serif;-webkit-user-select:none}
#card{position:absolute;inset:4px;background:#231942;color:#fff;border-radius:16px;box-shadow:0 10px 36px rgba(0,0,0,.45);display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:6px;padding:10px 12px;-webkit-app-region:drag;border-bottom:1px solid rgba(255,255,255,.1)}
header b{font-size:13px;flex:1}
button{-webkit-app-region:no-drag;border:0;background:rgba(255,255,255,.1);color:#fff;border-radius:8px;padding:5px 10px;font:600 12px -apple-system,sans-serif;cursor:pointer}
button:hover{background:rgba(255,255,255,.2)}button.pri{background:#7b5cf0}button.rec{background:#e5484d}
textarea{flex:1;background:transparent;border:0;color:#fff;font:15px/1.55 -apple-system,sans-serif;padding:14px;resize:none;outline:none}
#prompt{flex:1;overflow:hidden;position:relative}
#scroll{padding:60px 22px 200px;font-size:30px;line-height:1.5;font-weight:600;white-space:pre-wrap;will-change:transform}
#mark{position:absolute;left:0;top:calc(34% + 14px);width:0;height:0;border-left:11px solid #34e0a1;border-top:9px solid transparent;border-bottom:9px solid transparent}
footer{display:flex;gap:6px;align-items:center;padding:8px 12px;border-top:1px solid rgba(255,255,255,.1);font-size:12px}
.hide{display:none!important}
</style></head><body><div id="card">
<header><b id="title">Speaker notes</b><button id="dict" title="Dictate with local Whisper">🎙 Dictate</button><button id="save" class="pri">Save</button><button id="close">✕</button></header>
<textarea id="ta" placeholder="Type or dictate your notes. They stay on this computer and never appear in your recording."></textarea>
<div id="prompt" class="hide"><div id="mark"></div><div id="scroll"></div></div>
<footer id="foot" class="hide"><button id="play" class="pri">▶ Scroll</button><button id="slow">−</button><span id="spd">speed 2</span><button id="fast">+</button><span style="flex:1"></span><button id="smaller">A−</button><button id="bigger">A+</button></footer>
</div><script>
const $ = (i) => document.getElementById(i); let mode = 'edit', playing = false, speed = 2, y = 0, size = 30, raf;
spool.on('notes:mode', (o) => {
  mode = o.mode; $('ta').value = o.text || '';
  const prompt = mode === 'prompt';
  $('ta').classList.toggle('hide', prompt); $('prompt').classList.toggle('hide', !prompt); $('foot').classList.toggle('hide', !prompt);
  $('dict').classList.toggle('hide', prompt); $('save').classList.toggle('hide', prompt); $('title').textContent = prompt ? 'Teleprompter' : 'Speaker notes';
  if (prompt) { $('scroll').textContent = o.text || '(no notes)'; y = 0; $('scroll').style.transform = 'translateY(0)'; }
});
$('save').onclick = () => { spool.send('notes:save', $('ta').value); };
$('close').onclick = () => spool.send(mode === 'prompt' ? 'tool' : 'notes:close', 'notes');
$('play').onclick = () => { playing = !playing; $('play').textContent = playing ? '⏸ Pause' : '▶ Scroll'; if (playing) tick(); };
function tick() { if (!playing) return; y += speed * 0.35; $('scroll').style.transform = `translateY(${-y}px)`; raf = requestAnimationFrame(tick); }
$('slow').onclick = () => { speed = Math.max(1, speed - 1); $('spd').textContent = 'speed ' + speed; };
$('fast').onclick = () => { speed = Math.min(10, speed + 1); $('spd').textContent = 'speed ' + speed; };
$('smaller').onclick = () => { size = Math.max(18, size - 3); $('scroll').style.fontSize = size + 'px'; };
$('bigger').onclick = () => { size = Math.min(60, size + 3); $('scroll').style.fontSize = size + 'px'; };
// dictation: capture 16 kHz mono PCM, ship to main for local Whisper
let ctx, proc, src, stream, chunks = [], recording = false;
$('dict').onclick = async () => {
  if (!recording) {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true }); ctx = new AudioContext({ sampleRate: 16000 }); src = ctx.createMediaStreamSource(stream);
    proc = ctx.createScriptProcessor(4096, 1, 1); chunks = []; proc.onaudioprocess = (e) => chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
    src.connect(proc); proc.connect(ctx.destination); recording = true; $('dict').textContent = '⏹ Stop'; $('dict').className = 'rec';
  } else {
    recording = false; proc.disconnect(); src.disconnect(); stream.getTracks().forEach((t) => t.stop()); ctx.close();
    $('dict').textContent = 'Transcribing…'; $('dict').className = '';
    const n = chunks.reduce((a, c) => a + c.length, 0), all = new Float32Array(n); let o = 0; chunks.forEach((c) => { all.set(c, o); o += c.length; });
    const text = await spool.invoke('notes:dictate', all.buffer);
    if (text) $('ta').value += ($('ta').value && !$('ta').value.endsWith('\n') ? '\n' : '') + text;
    $('dict').textContent = '🎙 Dictate';
  }
};
</script></body></html>
