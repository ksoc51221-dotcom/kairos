<title>Edit · Iris</title><link rel="stylesheet" href="/static/app.css"><style>

.right { border-left: 1px solid var(--line-soft); display: flex; flex-direction: column; min-height: 0; min-width: 0; }

<script>

      const dx = (m.clientX - s.x) / r.width, dy = (m.clientY - s.y) / r.height, c = (v, lo = 0, hi = 1) => Math.max(lo, Math.min(hi, v));
      if (h === 'move') { o.x = c(s.xo + dx, 0, 1 - o.w); o.y = c(s.yo + dy, 0, 1 - o.h); }
      else { let x1 = s.xo, y1 = s.yo, x2 = s.xo + s.wo, y2 = s.yo + s.ho; if (h.includes('w')) x1 = c(x1 + dx, 0, x2 - 0.03); if (h.includes('e')) x2 = c(x2 + dx, x1 + 0.03, 1); if (h.includes('n')) y1 = c(y1 + dy, 0, y2 - 0.03); if (h.includes('s')) y2 = c(y2 + dy, y1 + 0.03, 1); Object.assign(o, { x: x1, y: y1, w: x2 - x1, h: y2 - y1 }); }
      ovPlace(el, o); ctl.setVM({ ...vm, autoZoom: false });
    };
    s.xo = o.x; s.yo = o.y; s.wo = o.w; s.ho = o.h; el.onpointerup = () => { el.onpointermove = el.onpointerup = null; saveSoon(); };
  };
}

// ----- style: captions, background, call-to-action, thumbnail, GIF preview -----
const patch = async (body) => { try { const r = await api(`/api/videos/${id}`, { method: 'PATCH', body }); vm = { ...vm, ...r, words: vm.words, library: vm.library }; ctl.setVM({ ...vm, autoZoom: false }); } catch (e) { toast(e.message); } };
const patchSoon = (() => { let t; return (b) => { clearTimeout(t); t = setTimeout(() => patch(b), 450); }; })();
function tStyle(p) {
  const cta = vm.cta || { text: '', url: '' };
  p.innerHTML = `<div class="sub">Captions</div><div class="set"><div class="lab">Show captions from the start<small style="display:block;color:var(--mute)">Viewers can still turn them off</small></div><input type="checkbox" class="sw" id="cp-on" ${vm.captionsDefault ? 'checked' : ''} ${vm.segments?.length ? '' : 'disabled'}></div>
    <div class="cap-g" id="cap-g">${[['classic', 'Classic'], ['bold', 'Bold'], ['yellow', 'Yellow'], ['minimal', 'Minimal'], ['mint', 'Mint'], ['blue', 'Blue']].map(([k, l]) => `<button data-k="${k}" class="${(vm.captionStyle === 'purple' ? 'blue' : vm.captionStyle || 'classic') === k ? 'on' : ''}"><span style="${CAPTION_STYLES[k]}">${l}</span></button>`).join('')}</div>
    <div class="sub">Background</div><div class="bg-g" id="bg-g">${[['none', ''], ['blue', ''], ['mint', ''], ['sunset', ''], ['night', ''], ['aurora', '']].map(([k]) => `<button data-k="${k}" class="${(vm.background === 'purple' ? 'blue' : vm.background || 'none') === k ? 'on' : ''}" title="${k}" style="background:${BACKGROUNDS[k] || 'repeating-conic-gradient(#ccc 0 25%,#fff 0 50%) 50%/12px 12px'}"></button>`).join('')}</div>
    <div class="sub">Call-to-action button</div><p class="hint">A button on the player, shown in the last 8 seconds and whenever the video is paused.</p>
    <div class="frm"><label>Button text</label><input class="field" id="cta-t" value="${esc(cta.text)}" placeholder="Book a call"><label>Link</label><input class="field" id="cta-u" value="${esc(cta.url)}" placeholder="https://…"></div>
    <div class="actions" style="display:flex;gap:8px;margin-top:10px"><button class="btn sm" id="cta-x" ${vm.cta ? '' : 'disabled'}>Remove button</button></div>
    <div class="sub">Thumbnail</div><div class="thumbs"><img id="thumb" src="/media/${id}/thumb.jpg?v=${Date.now()}" alt=""><div style="display:flex;flex-direction:column;gap:8px"><button class="btn sm" id="th-frame">Use the frame at ${mmss($('v').currentTime)}</button><label class="btn sm" for="th-file" style="cursor:pointer">${I('upload')}Upload a picture</label><input id="th-file" type="file" accept="image/*" hidden><button class="btn sm ghost" id="th-reset">Reset</button></div></div>
    <div class="sub">GIF preview</div><p class="hint">A 3 second loop that plays when someone hovers the video in the library.</p><div class="thumbs">${vm.hasGif ? `<img id="gif" src="/media/${id}/preview.gif?v=${Date.now()}" alt="">` : ''}<div><button class="btn sm" id="gif-make">Make it from ${mmss($('v').currentTime)}</button></div></div>`;
  $('cp-on').onchange = (e) => patch({ captionsDefault: e.target.checked, ...(e.target.checked && !vm.captionStyle ? { captionStyle: 'classic' } : {}) });
  $('cap-g').querySelectorAll('button').forEach((b) => (b.onclick = async () => { await patch({ captionStyle: b.dataset.k, captionsDefault: true }); if (!ctl.caps) await ctl.setCaptions('original').catch(() => {}); tStyle(p); }));
  $('bg-g').querySelectorAll('button').forEach((b) => (b.onclick = async () => { await patch({ background: b.dataset.k }); toast('The background shows on the watch page'); tStyle(p); }));
  const saveCta = () => patchSoon({ cta: $('cta-u').value.trim() ? { text: $('cta-t').value.trim() || 'Learn more', url: $('cta-u').value.trim() } : null });
  $('cta-t').oninput = saveCta; $('cta-u').oninput = saveCta; $('cta-x').onclick = async () => { await patch({ cta: null }); tStyle(p); };
  $('th-frame').onclick = async () => { try { await post(`/api/videos/${id}/thumbnail`, { at: $('v').currentTime }); toast('Thumbnail set'); tStyle(p); } catch (e) { toast(e.message); } };
  $('th-file').onchange = async () => { const f = $('th-file').files[0]; if (!f) return; try { const r = await fetch(`/api/videos/${id}/thumbnail`, { method: 'PUT', headers: { 'content-type': f.type }, body: f }); if (!r.ok) throw new Error((await r.json()).error); toast('Thumbnail set'); tStyle(p); } catch (e) { toast(e.message); } };
  $('th-reset').onclick = async () => { await fetch(`/api/videos/${id}/thumbnail`, { method: 'DELETE' }); toast('Thumbnail reset'); tStyle(p); };
  $('gif-make').onclick = async () => { $('gif-make').disabled = true; $('gif-make').textContent = 'Making it…'; try { await post(`/api/videos/${id}/gif`, { at: $('v').currentTime }); vm.hasGif = true; toast('GIF preview made'); } catch (e) { toast(e.message); } tStyle(p); };
}
boot();
</script></body></html>
