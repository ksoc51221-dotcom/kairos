<script>
const { $, fmt, esc, api, viewer, setViewer, gateUI, attach, LANGS } = SP, { i: I } = UI;
const id = location.pathname.split('/').pop();
const KINDS = [['good', 'Looks good', 'check-circle'], ['question', 'Question', 'help-circle'], ['issue', 'Problem', 'alert-triangle'], ['idea', 'Idea', 'lightbulb'], ['key', 'Key moment', 'flag']];
let me = { owner: false }, vm, ctl, tab = null, loaded = false, lastKey = '', an = null, anFor = '';
const toast = (m) => { $('toast').textContent = m; $('toast').classList.add('on'); setTimeout(() => $('toast').classList.remove('on'), 1800); };
const now = () => $('v')?.currentTime || 0; // B10: screenshots replace #v with an <img>
const copied = (btn) => { const t = btn.innerHTML; btn.textContent = 'Copied'; setTimeout(() => (btn.innerHTML = t), 1400); }; // U16
const seek = (t) => { const v = $('v'); if (!v) return; v.currentTime = t; v.play(); };
const mentions = (t) => esc(t).replace(/@(\w+)/g, '<span class="men">@$1</span>');
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const patch = async (body) => { vm = await api(`/api/videos/${id}`, { method: 'PATCH', body }); ctl?.setVM(vm); lastKey = ''; render(); };

async function boot() {
  UI.fill(document); $('v').poster = `/media/${id}/thumb.jpg`; // U12: the poster and the skeletons are on screen before any API call returns
  me = await api('/api/me'); UI.brand(me.brand);
  $('brand').innerHTML = UI.logo(me.brand) + (me.brand.hideBranding ? '' : `<span>${esc(me.brand.name)}</span>`);
  if (document.cookie.includes('sp_asviewer=1')) { $('viewas').hidden = false; document.documentElement.style.setProperty('--vb', '34px'); }
  $('ownerBtns').hidden = !me.owner; $('nav').hidden = !me.owner; $('vcopy').hidden = me.owner; $('later').hidden = !me.owner; $('who').textContent = UI.initials(me.name || me.brand.name);
  $('title').readOnly = !me.owner;
  try { vm = await api(`/api/v/${id}`); }
  catch (e) { if (e.data?.gate || e.status === 401 || e.status === 403) return gateUI($('root'), id, e, () => location.reload()); if (e.status === 404) { $('root').innerHTML = '<div class="gate"><h2>Video not found</h2></div>'; return; } throw e; }
  tab = me.owner ? (vm.forAgent && vm.type !== 'image' ? 'actions' : 'edit') : 'activity'; // "Record for agent" opens on the Action Plan
  $('planBtn').hidden = !(me.owner && vm.type !== 'image');
  if (vm.type === 'image') { $('stage').className = 'stage framed imgview'; $('stage').style.aspectRatio = 'auto'; $('stage').innerHTML = `<img src="/media/${id}/image.png" style="max-width:100%">`; $('pc').hidden = true; }
  else { ctl = attach({ stage: $('stage'), video: $('v'), vm, controls: $('pc') }); }

}
function setupCC() {
  $('cc').innerHTML = '<option value="">CC: off</option><option value="original">Captions</option><optgroup label="Translate (local AI)">' + LANGS.map((l) => `<option>${l}</option>`).join('') + '</optgroup>';
  $('cc').onchange = async () => { const v = $('cc').value; try { if (v && v !== 'original') toast(`Translating to ${v}… first time takes a moment`); await ctl.setCaptions(v || null); } catch (e) { toast(e.message); $('cc').value = ''; } };
}
// U3: the server pushes "this video changed" over one event stream, and the page refetches only then. No timer, so nothing is rebuilt for no reason.
let refetching = false, again = false;
async function refetch() {
  if (refetching) { again = true; return; }
  if (['ctext', 'title'].includes(document.activeElement.id) || !$('modal').hidden || document.activeElement.closest?.('#panel input,#panel select,#panel textarea')) { setTimeout(refetch, 1500); return; }
  refetching = true;
  try { takeVM(await api(`/api/v/${id}`)); render(); } catch {}
  refetching = false; if (again) { again = false; refetch(); }
}
// Bleep speech replaces video.mp4 and the captions under the same URLs: when a bleep (or its undo) lands, load both again so the old words are not left in the player
const mediaSig = (x) => (x && x.redactResult && x.redactResult.at) || '';
function mediaChanged() {
  if (vm.type === 'image' || !loaded) return;
  const el = $('v'), t = el.currentTime, was = !el.paused;
  el.src = `/media/${id}/video.mp4?v=${Date.now()}`; el.addEventListener('loadedmetadata', () => { el.currentTime = t; if (was) el.play().catch(() => {}); }, { once: true });
  const l = $('cc').value; if (l) ctl?.setCaptions(l).catch(() => {});
}
function takeVM(nv) { const before = mediaSig(vm); vm = nv; ctl?.setVM(vm); if (before !== mediaSig(vm)) mediaChanged(); }

  if (!window.EventSource) return void setInterval(() => { if (!document.hidden) refetch(); }, 5000);
  const es = new EventSource(`/api/events?video=${id}`);
  es.addEventListener('video', refetch);
  es.onerror = () => { if (es.readyState === EventSource.CLOSED) setInterval(() => { if (!document.hidden) refetch(); }, 5000); };
}

// ---- tabs: Edit · Activity · Generate · AI Actions · Transcript · Settings (owner); Activity · Generate · Transcript (viewers) ----
const hasGen = () => !!(vm.summary || vm.chapters?.length || vm.tasks?.length || vm.guide);
function tabsFor() { const t = []; if (me.owner) t.push(['edit', 'Edit']); t.push(['activity', 'Activity']); if (me.owner || hasGen()) t.push(['generate', 'Generate']); if (me.owner && vm.type !== 'image') t.push(['actions', 'AI Actions']); t.push(['transcript', 'Transcript']); if (me.owner) t.push(['settings', 'Settings']); return t; }
const scrollOf = {};
function renderTabs() {
  const t = tabsFor(), sig = t.map((x) => x[0]).join();
  if (!t.some((x) => x[0] === tab)) tab = t[0][0];
  if ($('tabs').dataset.sig !== sig) {
    $('tabs').dataset.sig = sig;
    $('tabs').innerHTML = t.map(([k, l]) => `<button data-t="${k}">${l}</button>`).join('') + '<i class="ind"></i>';

      <p class="note" style="margin:12px 0 0;font-size:13px">Need a password on the link? <a href="/settings">Set up Backblaze + Cloudflare in Settings</a> instead.</p>`;
  };
  const connNote = () => { const c = pu.connected; return c ? `<p class="note" style="margin:0 0 10px;font-size:13px">GitHub is connected${c.who ? ` as <b>${esc(c.who)}</b>` : ''}.${c.noDel ? ` One catch: ${c.cli ? 'this login' : 'this token'} cannot delete repositories, so Kairos cannot remove the copy after 30 days or when you click Unpublish. You would delete it on GitHub yourself${c.cli ? ', or run <code>gh auth refresh -s delete_repo</code> in Terminal to allow it' : ', or make a new token with “delete_repo” ticked'}.` : ''}</p>` : ''; };
  const ghConnect = async (body) => {
    gs.busy = true; gs.err = ''; drawPub();
    try {
      await api('/api/settings', { method: 'PUT', body: { integrations: { github: body } } });
      const steps = (await api('/api/publish/test', { body: { host: 'github' } })).steps || [], bad = steps.find((x) => !x.ok && x.name !== 'Can delete repositories'); // a login that cannot delete still publishes; it just cannot clean up after itself
      if (bad || !steps.length) {
        await api('/api/settings', { method: 'PUT', body: { integrations: { github: { token: '', useGh: false } } } }).catch(() => {}); // back to how it was: nothing half-saved
        throw new Error(bad ? bad.detail : 'GitHub did not answer. Try again.');
      }
      pu.connected = { who: String((steps.find((x) => x.name === 'Sign-in') || {}).detail || '').replace(/^Signed in as /, '').replace(/\.$/, ''), noDel: steps.some((x) => x.name === 'Can delete repositories' && !x.ok), cli: !!body.useGh };
      gs.tok = ''; pub = await api(`/api/videos/${id}/publish`); vm.publish = pub;
    } catch (e) { gs.err = e.message; }
    gs.busy = false; drawPub();
  };
  const pday = (t) => new Date(t).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
  const pmb = (b) => `${(b / 1048576).toFixed(b > 1e8 ? 0 : 1)} MB`;
  const pollPub = () => {
    clearInterval(pubTimer); if (pub?.state !== 'working') return;
    pubTimer = setInterval(async () => { try { pub = await api(`/api/videos/${id}/publish`); vm.publish = pub; if (pub.state !== 'working') clearInterval(pubTimer); drawPub(); } catch { /* keep polling */ } }, 1200);
  };
  const GH_WARN = `<div class="callout warn" style="margin-top:10px;display:block"><b>Read this before you publish to GitHub</b><ul style="margin:6px 0 0;padding-left:18px"><li><b>No password.</b> Anyone who has the link can watch and save the video. The page asks search engines not to list it, but the repository will appear on your public GitHub profile.</li><li><b>Deleting is not guaranteed.</b> Kairos tries to delete the repository after 30 days or when you click Unpublish (it needs the delete permission on your GitHub login), and GitHub may keep copies in caches. Anyone who already saved or forked the video keeps it.</li><li>Only a smaller copy of this video (720p) and its title leave your Mac.</li></ul></div>`;
  const pubForm = (P) => {
    const hs = avail(P), host = (pu.host = hs.some((h) => h[0] === pu.host) ? pu.host : hs[0][0]), can = hs.find((h) => h[0] === host)[2];
    const picker = hs.length > 1 ? `<div class="rowf" style="flex-wrap:wrap;gap:8px;margin-bottom:10px">${hs.map(([k]) => `<button class="btn sm ${host === k ? 'pri' : ''}" data-ph="${k}">${HOSTS[k]}</button>`).join('')}</div><p class="note" style="margin:0 0 10px;font-size:13px;color:var(--mute)">${host === 'github' ? 'Fastest and free. No password option, and deleting is not guaranteed.' : 'Has a password option, and the copy is really deleted. Slower to set up: two accounts.'}</p>` : '';
    if (!can.ok) return picker + `<p class="note" style="margin:0;font-size:13px;color:var(--mute)">${esc(can.message)}</p>`;
    const modes = can.modes, mode = (pu.mode = modes.includes(pu.mode) ? pu.mode : modes.includes(P.mode) ? P.mode : modes[0]);
    const what = host === 'github' ? 'I understand it will be <b>public on GitHub with no password</b>, that deleting it later is <b>not guaranteed</b>, and that the Privacy Guard cannot catch everything. It does not blur faces.'
      : `I understand Kairos will upload a copy of <b>${esc(vm.title)}</b> to Backblaze and Cloudflare servers for up to 30 days. The Privacy Guard blurs what it recognises, but it cannot catch everything, and it does not blur faces.`;
    return `${picker}${host === 'github' ? GH_WARN : `<div class="rowf" style="flex-wrap:wrap;gap:8px">${modes.map((k) => `<button class="btn sm ${mode === k ? 'pri' : ''}" data-pm="${k}">${PMODES[k]}</button>`).join('')}</div>`}
      ${host !== 'github' && mode === 'password' ? `<div class="pwrow"><input class="field" type="password" id="pub-pw" autocomplete="new-password" placeholder="Choose a password (8 or more characters). You must tell people yourself." value="${esc(pu.pw)}"></div>` : ''}
      ${(can.warnings || []).map((w) => `<p class="note" style="margin:10px 0 0;font-size:13px;color:var(--warn-ink)">${esc(w)}</p>`).join('')}
      <label style="display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:13px;line-height:1.45"><input type="checkbox" id="pub-ok" ${pu.ok ? 'checked' : ''} style="margin-top:3px"><span>I have watched this video on this Mac. ${what}</span></label>
      ${pu.err ? `<p class="note" style="margin:8px 0 0;font-size:13px;color:var(--danger)">${esc(pu.err)}</p>` : ''}
      <div class="rowf" style="margin-top:12px;gap:8px"><button class="btn pri" id="pub-go" ${pu.ok && !pu.busy && (host === 'github' || mode !== 'password' || pu.pw.length >= 8) ? '' : 'disabled'}>${pu.busy ? 'Starting…' : P.state === 'live' ? 'Republish' : host === 'github' ? 'Publish to GitHub' : 'Publish'}</button>${pu.form && P.state === 'live' ? '<button class="btn sm" id="pub-cancel-form">Never mind</button>' : ''}</div>`;
  };
  function drawPub() {
    const el = m.querySelector('#m-pub'); if (!el) return;
    const P = pub; if (!P) { el.innerHTML = ''; return; }
    let h = '';
    if (!avail(P).length) h = ghSetup();
    else if (P.state === 'working') {
      const pct = Math.round((P.progress || 0) * 100);
      h = `<div style="font-size:14px">${P.stage === 'uploading' ? 'Uploading' : P.stage === 'finishing' && P.host === 'github' ? 'GitHub is building the page (this can take a minute or two)' : P.stage === 'finishing' ? 'Finishing' : 'Making a small copy'}… ${pct}%</div><progress max="1" value="${P.progress || 0}" style="width:100%;margin:8px 0"></progress>
        ${P.previous ? `<p class="note" style="margin:0 0 8px;font-size:13px;color:var(--mute)">The earlier link keeps working until the new one is ready.</p>` : ''}<button class="btn sm" id="pub-cancel">Cancel</button>`;
    } else {
      if (P.state === 'live') {
        h = `<div class="rowf" style="gap:8px"><input class="field" readonly id="pub-url" value="${esc(P.url)}" style="flex:1;min-width:0"><button class="btn sm" id="pub-copy">Copy</button><a class="btn sm" target="_blank" rel="noopener" href="${esc(P.url)}">Open</a></div>
          <p class="note" style="margin:8px 0 0;font-size:13px;color:var(--mute)">${P.host === 'github' ? 'GitHub · no password, anyone with the link can watch and save it' : esc(PMODES[P.mode] || P.mode)} · available until ${pday(P.expiresAt)} · ${pmb(P.bytes || 0)}${P.allowDownload ? '' : ' · downloads off'}</p>
          ${P.host === 'github' && P.repoUrl ? `<p class="note" style="margin:6px 0 0;font-size:13px;color:var(--mute)"><a target="_blank" rel="noopener" href="${esc(P.repoUrl)}">View the repository on GitHub</a></p>` : ''}
          ${P.stale ? `<p class="note" style="margin:8px 0 0;font-size:13px;color:var(--warn-ink)"><b>Out of date:</b> ${esc(P.staleWhy)}. The public link still shows the old version. Republish to update it.</p>` : ''}
          ${P.notice ? `<p class="note" style="margin:8px 0 0;font-size:13px;color:var(--warn-ink)">${esc(P.notice)}</p>` : ''}
          ${pu.form ? `<div style="margin-top:12px">${pubForm(P)}</div>` : `<div class="rowf" style="margin-top:12px;gap:8px"><button class="btn sm" id="pub-re">Republish…</button><button class="btn sm danger" id="pub-un">Unpublish</button></div>`}`;
      } else {
        const why = P.state === 'failed' ? `Publishing failed: ${P.error || 'unknown problem'}` : P.state === 'removed' ? P.reason : P.state === 'expired' ? 'The earlier public link expired and its copy was deleted.' : '';
        h = `${connNote()}${why ? `<p class="note" style="margin:0 0 10px;font-size:13px;color:${P.state === 'failed' ? 'var(--danger)' : 'var(--mute)'}">${esc(why)}</p>` : ''}${pubForm(P)}`;
      }
    }
    el.innerHTML = `<h5>Public link<small>Opens on any phone or computer, even when this Mac is off</small></h5><div class="more" style="margin-top:6px">${h}</div>`;
    const q = (x) => el.querySelector(x);
    const gtok = q('#gh-tok'); if (gtok) { gtok.oninput = () => { gs.tok = gtok.value; const b = q('#gh-save'); if (b) b.disabled = gs.busy || !tokOk(); }; gtok.onkeydown = (e) => { if (e.key === 'Enter' && tokOk() && !gs.busy) ghConnect({ token: gs.tok.trim(), useGh: false }); }; }
    if (q('#gh-cli')) q('#gh-cli').onclick = () => ghConnect({ useGh: true });
    if (q('#gh-save')) q('#gh-save').onclick = () => ghConnect({ token: gs.tok.trim(), useGh: false });
    if (q('#gh-tok-open')) q('#gh-tok-open').onclick = () => { gs.tokOpen = true; gs.err = ''; drawPub(); q('#gh-tok')?.focus(); };
    if (q('#gh-cli-back')) q('#gh-cli-back').onclick = (e) => { e.preventDefault(); gs.tokOpen = false; gs.err = ''; drawPub(); };
    el.querySelectorAll('[data-pm]').forEach((b) => (b.onclick = () => { pu.mode = b.dataset.pm; drawPub(); }));
    el.querySelectorAll('[data-ph]').forEach((b) => (b.onclick = () => { pu.host = b.dataset.ph; pu.mode = null; pu.ok = false; pu.err = ''; drawPub(); }));
    const pw = q('#pub-pw'); if (pw) pw.oninput = () => { pu.pw = pw.value; const g = q('#pub-go'); if (g) g.disabled = !(pu.ok && !pu.busy && pu.pw.length >= 8); };
    const ok = q('#pub-ok'); if (ok) ok.onchange = () => { pu.ok = ok.checked; const g = q('#pub-go'); if (g) g.disabled = !(pu.ok && !pu.busy && (pu.host === 'github' || pu.mode !== 'password' || pu.pw.length >= 8)); };
    if (q('#pub-copy')) q('#pub-copy').onclick = async (e) => { await navigator.clipboard.writeText(P.url); copied(e.currentTarget); };
    if (q('#pub-re')) q('#pub-re').onclick = () => { pu.form = true; pu.ok = false; pu.err = ''; drawPub(); };
    if (q('#pub-cancel-form')) q('#pub-cancel-form').onclick = () => { pu.form = false; drawPub(); };
    if (q('#pub-un')) q('#pub-un').onclick = async () => {
      if (!confirm(P.host === 'github' ? 'Delete the GitHub repository? The link stops working for everyone. Copies someone already saved or forked stay with them.' : 'Delete the public copy? The link stops working for everyone.')) return;
      try { pub = await api(`/api/videos/${id}/publish`, { method: 'DELETE' }); vm.publish = pub; toast(pub.removal === 'queued' ? (pub.removalError ? `Link is off in Kairos, but the copy is still there. ${pub.removalError}` : 'Link is off. The copy will be deleted as soon as the internet is back.') : 'Public link removed'); } catch (e) { toast(e.message); }
      pu.form = false; drawPub();
    };
    if (q('#pub-cancel')) q('#pub-cancel').onclick = async () => { try { pub = await api(`/api/videos/${id}/publish`, { method: 'DELETE' }); vm.publish = pub; } catch (e) { toast(e.message); } clearInterval(pubTimer); drawPub(); };
    if (q('#pub-go')) q('#pub-go').onclick = async () => {
      pu.busy = true; pu.err = ''; pu.connected = null; drawPub();
      try { pub = await api(`/api/videos/${id}/publish`, { body: { host: pu.host, mode: pu.host === 'github' ? 'link' : pu.mode, password: pu.host !== 'github' && pu.mode === 'password' ? pu.pw : undefined, confirm: true } }); vm.publish = pub; pu.form = false; pu.pw = ''; pu.ok = false; pollPub(); }
      catch (e) { pu.err = e.message; }
      pu.busy = false; drawPub();
    };
  }
  pollPub();
  function wire() {
    m.querySelector('#m-x').onclick = close; m.querySelectorAll('[data-p]').forEach((b) => (b.onclick = () => { st.panel = st.panel === b.dataset.p ? null : b.dataset.p; draw(); }));
    const to = m.querySelector('#m-to'); to.onkeydown = (e) => { if ((e.key === 'Enter' || e.key === ',') && to.value.trim()) { e.preventDefault(); if (addPerson(to.value)) { draw(); m.querySelector('#m-to').focus(); } } }; to.onblur = () => { if (to.value.trim() && addPerson(to.value)) draw(); };
    m.querySelectorAll('[data-rp]').forEach((b) => (b.onclick = () => { st.people.splice(+b.dataset.rp, 1); draw(); }));
    m.querySelectorAll('[data-rs]').forEach((b) => (b.onclick = () => { st.spaces.delete(b.dataset.rs); draw(); }));
    m.querySelectorAll('[data-as]').forEach((b) => (b.onclick = () => { st.spaces.add(b.dataset.as); draw(); }));
    m.querySelector('#m-acc').onclick = () => popover(m.querySelector('#m-acc'), Object.entries(ACCESS).map(([k, [n, d, ic]]) => `<button class="mi" data-m="${k}">${I(ic)}<span><b style="font-weight:600">${n}</b><br><small style="color:var(--mute)">${d}</small></span></button>`).join(''), (pp, c) => pp.querySelectorAll('[data-m]').forEach((b) => (b.onclick = () => { c(); st.mode = b.dataset.m; draw(); })));
    const pw = m.querySelector('#m-pw'); if (pw) pw.oninput = () => { st.pw = pw.value; m.querySelector('#m-go').disabled = !dirty(); m.querySelector('#m-go').classList.toggle('pri', dirty()); };
    m.querySelector('#m-copy').onclick = async (e) => { await navigator.clipboard.writeText(link()); copied(e.currentTarget); };
    m.querySelector('#m-time').onchange = (e) => { st.withTime = e.target.checked; };
    m.querySelector('#m-lock').onclick = () => { st.mode = 'password'; draw(); setTimeout(() => m.querySelector('#m-pw')?.focus(), 30); };
    if (m.querySelector('#m-ecopy')) m.querySelector('#m-ecopy').onclick = async (e) => { await navigator.clipboard.writeText(m.querySelector('code.b').textContent); copied(e.currentTarget); };
    m.querySelector('#m-go').onclick = async () => {
      if (to.value.trim()) addPerson(to.value);
      try {
        const body = { privacy: { mode: st.mode, password: st.pw || undefined }, spaces: [...st.spaces] };
        vm = await api(`/api/videos/${id}`, { method: 'PATCH', body }); ctl?.setVM(vm);
        if (st.people.length) window.open(`mailto:${st.people.join(',')}?subject=${encodeURIComponent(vm.title)}&body=${encodeURIComponent('Watch: ' + link())}`, '_self');
        close(); lastKey = ''; render(); toast('Shared');
      } catch (e) { toast(e.message); }
    };
  }
  m.onclick = (e) => { if (e.target === m) close(); };
  document.addEventListener('keydown', trap, true); draw(); m.querySelector('#m-to').focus();
}
boot();
</script></body></html>
