<script>
const { $, fmt, esc, api, viewer, setViewer, gateUI, attach, LANGS } = SP, { i: I } = UI;
const id = location.pathname.split('/').pop(), EMOJI = ['❤️', '👍', '🔥', '👏', '🙌', '👀'], MORE_EMOJI = ['😂', '🎉', '😮', '😢', '🤔', '💯', '🚀', '👎', '🙏', '😍', '🤝', '✅'];
let me = { owner: false }, vm, ctl, tab = null, loaded = false, lastKey = '', an = null, anFor = '', promoShut = false;
const toast = (m) => { $('toast').textContent = m; $('toast').classList.add('on'); setTimeout(() => $('toast').classList.remove('on'), 1800); };
const now = () => $('v')?.currentTime || 0; // B10: screenshots replace #v with an <img>
const copied = (btn) => { const t = btn.innerHTML; btn.textContent = 'Copied ✓'; setTimeout(() => (btn.innerHTML = t), 1400); }; // U16
const seek = (t) => { const v = $('v'); if (!v) return; v.currentTime = t; v.play(); };
const mentions = (t) => esc(t).replace(/@(\w+)/g, '<span class="men">@$1</span>');
const patch = async (body) => { vm = await api(`/api/videos/${id}`, { method: 'PATCH', body }); ctl?.setVM(vm); lastKey = ''; render(); };

async function boot() {
  UI.fill(document); $('v').poster = `/media/${id}/thumb.jpg`; // U12: the poster and the skeletons are on screen before any API call returns
  me = await api('/api/me'); UI.brand(me.brand);
  $('brand').innerHTML = UI.logo(me.brand) + (me.brand.hideBranding ? '' : `<span>${esc(me.brand.name)}</span>`);
  if (document.cookie.includes('sp_asviewer=1')) $('viewas').hidden = false;
  $('ownerBtns').hidden = !me.owner; $('vcopy').hidden = me.owner; $('later').hidden = !me.owner; $('who').textContent = UI.initials(me.name || me.brand.name);
  $('title').readOnly = !me.owner;
  try { vm = await api(`/api/v/${id}`); }
  catch (e) { if (e.data?.gate || e.status === 401 || e.status === 403) return gateUI($('root'), id, e, () => location.reload()); if (e.status === 404) { $('root').innerHTML = '<div class="gate"><h2>Video not found</h2></div>'; return; } throw e; }
  tab = me.owner ? 'edit' : 'activity';
  if (vm.type === 'image') { $('stage').className = 'stage imgview'; $('stage').style.aspectRatio = 'auto'; $('stage').innerHTML = `<img src="/media/${id}/image.png" style="max-width:100%">`; $('cc').hidden = $('speed').hidden = true; }
  else { ctl = attach({ stage: $('stage'), video: $('v'), vm }); }
  setupCC(); render(); listen();
}
function setupCC() {
  $('cc').innerHTML = '<option value="">CC: off</option><option value="original">Captions</option><optgroup label="Translate (local AI)">' + LANGS.map((l) => `<option>${l}</option>`).join('') + '</optgroup>';
  $('cc').onchange = async () => { const v = $('cc').value; try { if (v && v !== 'original') toast(`Translating to ${v}… first time takes a moment`); await ctl.setCaptions(v || null); } catch (e) { toast(e.message); $('cc').value = ''; } };
}
// U3: the server pushes "this video changed" over one event stream, and the page refetches only then. No timer, so nothing is rebuilt for no reason.
let refetching = false, again = false;
async function refetch() {
  if (refetching) { again = true; return; }
  if (['ctext', 'title'].includes(document.activeElement.id) || !$('modal').hidden || document.activeElement.closest?.('.panel input,.panel select')) { setTimeout(refetch, 1500); return; }
  refetching = true;
  try { vm = await api(`/api/v/${id}`); ctl?.setVM(vm); render(); } catch {}
  refetching = false; if (again) { again = false; refetch(); }
}
function listen() {
  if (!window.EventSource) return void setInterval(() => { if (!document.hidden) refetch(); }, 5000);
  const es = new EventSource(`/api/events?video=${id}`);
  es.addEventListener('video', refetch);
  es.onerror = () => { if (es.readyState === EventSource.CLOSED) setInterval(() => { if (!document.hidden) refetch(); }, 5000); };
}

// ---- tabs: Edit · Activity · Generate · Transcript · Settings (owner); Activity · Generate · Transcript (viewers) ----
const hasGen = () => !!(vm.summary || vm.chapters?.length || vm.tasks?.length || vm.guide);
function tabsFor() { const t = []; if (me.owner) t.push(['edit', 'Edit']); t.push(['activity', 'Activity']); if (me.owner || hasGen()) t.push(['generate', 'Generate']); if (me.owner && vm.type !== 'image') t.push(['actions', 'AI Actions']); t.push(['transcript', 'Transcript']); if (me.owner) t.push(['settings', 'Settings']); return t; }
const scrollOf = {};
function renderTabs() {
  const t = tabsFor(), sig = t.map((x) => x[0]).join();
  if (!t.some((x) => x[0] === tab)) tab = t[0][0];
  if ($('tabs').dataset.sig !== sig) {
    $('tabs').dataset.sig = sig;
    $('tabs').innerHTML = t.map(([k, l]) => `<button data-t="${k}">${l}${k === 'generate' && vm.stage && vm.stage !== 'done' && me.owner ? '<span class="pill" style="padding:1px 7px">…</span>' : ''}</button>`).join('') + '<i class="ind"></i>';
    $('tabs').querySelectorAll('button').forEach((b) => b.onclick = () => go(b.dataset.t));
  }
  let on = null; $('tabs').querySelectorAll('button').forEach((b) => { const is = b.dataset.t === tab; b.classList.toggle('on', is); if (is) on = b; });

    <div class="set"><div class="lab">Link expires<small>Leave empty for never</small></div><input class="field" type="date" id="s-exp" value="${exp}"></div>
    <div class="sub">This video</div>
    <div class="ghead"><a class="btn" href="/media/${id}/download">${I('download')}Download</a><a class="btn" href="/view-as/viewer?to=${encodeURIComponent('/v/' + id)}">${I('eye')}Preview as viewer</a><button class="btn danger" id="del">${I('trash')}Delete</button></div>`;
  p.querySelectorAll('.sw[data-k]').forEach((s) => (s.onchange = () => (s.dataset.k === 'allowDownload' ? patch({ privacy: { allowDownload: s.checked } }) : patch({ [s.dataset.k]: s.checked }))));
  $('s-folder').onchange = () => patch({ folder: $('s-folder').value || null });
  $('s-tags').onchange = () => patch({ tags: $('s-tags').value.split(',').map((t) => t.trim()).filter(Boolean) });
  p.querySelectorAll('.s-sp').forEach((c) => (c.onchange = () => patch({ spaces: [...p.querySelectorAll('.s-sp:checked')].map((x) => x.value) })));
  $('s-exp').onchange = () => patch({ privacy: { expiresAt: $('s-exp').value ? new Date($('s-exp').value + 'T23:59:59').getTime() : 0 } });
  $('del').onclick = deleteVideo;
}
async function deleteVideo() { if (confirm('Delete this video for good?')) { await fetch(`/api/videos/${id}`, { method: 'DELETE' }); location.href = '/'; } }

// ---- comments / title / header ----
$('form').onsubmit = async (e) => { e.preventDefault(); const text = $('ctext').value.trim(); if (!text) return; if (!me.owner && !viewer().name) { const n = prompt('Your name for comments?') || 'Guest'; setViewer({ ...viewer(), name: n }); } $('ctext').value = '';
  vm = await api(`/api/v/${id}/comments`, { body: { text, at: now(), name: me.owner ? me.name : viewer().name } }); lastKey = ''; render(); };
$('title').onchange = async () => { vm = await api(`/api/videos/${id}`, { method: 'PATCH', body: { title: $('title').value } }); };
$('title').onkeydown = (e) => { if (e.key === 'Enter') e.target.blur(); };
$('speed').onchange = () => { if ($('v')) $('v').playbackRate = +$('speed').value; };
$('later').onclick = () => patch({ watchLater: !vm.watchLater });
const copyLink = async (btn) => { await navigator.clipboard.writeText(location.href.split('?')[0]); toast('Link copied'); };
$('vcopy').onclick = copyLink; $('copy').onclick = copyLink;
$('share').onclick = () => openShare();
$('moreBtn').onclick = () => popover($('moreBtn'), `<a class="mi" href="/edit/${id}">${I('scissors')}Edit video</a><a class="mi" href="/media/${id}/download">${I('download')}Download</a><button class="mi" id="mLater">${I('bookmark')}Watch later</button><a class="mi" href="/view-as/viewer?to=${encodeURIComponent('/v/' + id)}">${I('eye')}Preview as viewer</a><button class="mi danger" id="mDel">${I('trash')}Delete</button>`,
  (pp, close) => { pp.querySelector('#mLater').onclick = () => { close(); patch({ watchLater: !vm.watchLater }); }; pp.querySelector('#mDel').onclick = () => { close(); deleteVideo(); }; }, 'down', true);

// ---- AI Actions: one-click documents from the recording, the Action Plan for coding agents, and Send to ----
const AXICON = { sop: 'doc', pr: 'embed', bug: 'eye', issue: 'check', email: 'mail', recap: 'comment' };
const ax = { list: null, targets: [], ready: false, open: null, results: {}, busy: {}, err: '', loadedFor: '' };
async function loadActions() {
  try { const r = await api(`/api/videos/${id}/actions`); Object.assign(ax, { list: r.actions, targets: r.targets, ready: r.ready, err: '' }); } catch (e) { ax.err = e.message; ax.list = ax.list || []; }
  lastKey = ''; render();
}
async function openAction(a) {
  ax.open = ax.open === a ? null : a; lastKey = ''; render();
  if (ax.open && !ax.results[a] && ax.list.find((x) => x.id === a)?.cached) { try { ax.results[a] = await api(`/api/videos/${id}/actions/${a}`); lastKey = ''; render(); } catch {} }
}
async function runAction(a, force) {
  ax.busy[a] = true; ax.open = a; lastKey = ''; render();
  try { ax.results[a] = await api(`/api/videos/${id}/actions/${a}`, { method: 'POST', body: { force: !!force } }); toast('Done'); } catch (e) { toast(e.message); }
  ax.busy[a] = false; await loadActions();
}
function renderActions(p) {
  p.dataset.k = 'actions';
  const sig = `${id}:${vm.duration}:${(vm.segments || []).length}:${vm.shareable}`;
  if (ax.loadedFor !== sig) { ax.loadedFor = sig; loadActions(); }
  if (!ax.list) { p.innerHTML = '<div class="empty">Loading…</div>'; return; }
  const t = ax.targets;
  const rows = ax.list.map((a) => {
    const r = ax.results[a.id], busy = ax.busy[a.id], open = ax.open === a.id;
    return `<div class="axrow"><span class="tile">${I(AXICON[a.id] || 'doc')}</span><div class="lab">${esc(a.label)}<small>${esc(a.blurb)}${a.cached ? (a.cached.stale ? ' · <b>transcript changed since</b>' : ` · made ${UI.ago(a.cached.at)}`) : ''}</small></div>
      <button class="btn sm ${a.cached ? '' : 'pri'}" data-ax="${a.id}" ${busy || !ax.ready ? 'disabled' : ''}>${busy ? 'Writing…' : a.cached ? (open ? 'Hide' : 'Open') : 'Generate'}</button></div>` +
      (open && r ? `<div class="card2" style="margin-top:10px"><div class="md" id="axmd">${esc(r.markdown)}</div><div class="axbar"><button class="btn sm" data-axcopy="${a.id}">Copy</button><button class="btn sm" data-axre="${a.id}">${a.cached?.stale ? 'Regenerate (transcript changed)' : 'Regenerate'}</button>
        <span class="chip" style="align-self:center">Send to</span>${t.map((x) => `<button class="btn sm" data-axsend="${a.id}|${x.id}" ${x.ready ? '' : 'disabled'} title="${x.ready ? 'Shows exactly what will be sent first' : 'Add ' + esc(x.needs) + ' in Settings → Workspace → Integrations'}">${esc(x.label)}</button>`).join('')}</div></div>` : '');
  }).join('');
  p.innerHTML = `<div class="powered">Powered by AI ${I('sparkle')}</div><div class="sh"><h3>AI Actions</h3><span class="pill">${I('sparkle')} On this computer</span></div>
    ${ax.ready ? '' : '<div class="banner">Available once the Privacy Guard has cleared the video and it has a transcript.</div>'}${ax.err ? `<div class="err">${esc(ax.err)}</div>` : ''}
    <div class="card2"><h4>Record for agents</h4><p>Turn this recording into a brief for Claude Code, Cursor or any coding agent: what you said, the steps shown with screenshot files, where you clicked.</p>
      <div class="axbar"><button class="btn pri sm" id="planCopy" ${ax.ready ? '' : 'disabled'}>Copy action plan</button><a class="btn sm" href="/api/videos/${id}/action-plan?download=1">Download .md</a></div>
      <p class="chip" style="margin-top:8px">Or let an agent read it itself: <code>claude mcp add spool -- node mcp/server.js</code></p></div>
    ${rows}`;
  p.querySelectorAll('[data-ax]').forEach((b) => (b.onclick = () => (ax.list.find((x) => x.id === b.dataset.ax).cached ? openAction(b.dataset.ax) : runAction(b.dataset.ax))));
  p.querySelectorAll('[data-axre]').forEach((b) => (b.onclick = () => runAction(b.dataset.axre, true)));
  p.querySelectorAll('[data-axcopy]').forEach((b) => (b.onclick = async () => { await navigator.clipboard.writeText(ax.results[b.dataset.axcopy].markdown); copied(b); }));
  p.querySelectorAll('[data-axsend]').forEach((b) => (b.onclick = () => previewSend(...b.dataset.axsend.split('|'))));
  if ($('planCopy')) $('planCopy').onclick = async () => { try { const r = await fetch(`/api/videos/${id}/action-plan`); if (!r.ok) throw new Error((await r.json()).error); await navigator.clipboard.writeText(await r.text()); copied($('planCopy')); } catch (e) { toast(e.message); } };
}
// Send to: nothing leaves this computer until the person has seen the exact request (credentials hidden) and pressed Send.
async function previewSend(action, target) {
  let pv; try { pv = await api(`/api/videos/${id}/send/preview`, { body: { action, target } }); } catch (e) { toast(e.message); return; }
  const m = $('modal'); m.hidden = false;
  const close = () => { m.hidden = true; m.innerHTML = ''; document.removeEventListener('keydown', onKey, true); }, onKey = (e) => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey, true);
  m.innerHTML = `<div class="box" role="dialog" aria-modal="true" aria-label="Send to ${esc(pv.label)}"><h3>Send to ${esc(pv.label)}?</h3><p style="color:var(--mute)">${esc(pv.summary)}. This is exactly what will be sent; your key is hidden here.</p>
    <dl class="prev"><dt>Request</dt><dd>${esc(pv.method)} ${esc(pv.url)}</dd><dt>Headers</dt><dd><div class="md">${esc(Object.entries(pv.headers).map(([k, v]) => `${k}: ${v}`).join('\n'))}</div></dd><dt>Body</dt><dd><div class="md">${esc(JSON.stringify(pv.body, null, 2))}</div></dd></dl>
    <div class="axbar" style="justify-content:flex-end"><button class="btn" id="px-no">Cancel</button><button class="btn pri" id="px-go">Send</button></div></div>`;
  m.onclick = (e) => { if (e.target === m) close(); }; $('px-no').onclick = close; $('px-go').focus();
  $('px-go').onclick = async () => {
    $('px-go').disabled = true; $('px-go').textContent = 'Sending…';
    try { const r = await api(`/api/videos/${id}/send`, { body: { token: pv.token } }); close(); toast(r.link ? `Sent: ${r.link}` : `Sent (${r.detail})`); if (r.link) navigator.clipboard?.writeText(r.link).catch(() => {}); }
    catch (e) { $('px-go').disabled = false; $('px-go').textContent = 'Send'; toast(e.message); }
  };
}

// ---- share (reference: share-modal.webp): people, general access, then Copy link · Share at time · Set password · Share ----
const ACCESS = { link: ['Public', 'Anyone can find and view', 'globe'], email: ['Ask for email', 'Viewers enter their email to watch', 'mail'], password: ['Password', 'Viewers need the password', 'lock'], private: ['Only me', 'Nobody else can open it', 'lock'] };
async function openShare() {
  const [spaces, s] = await Promise.all([api('/api/spaces'), api('/api/settings')]);
  const base = s.lan && s.lanIp ? `http://${s.lanIp}:${s.port}` : location.origin, p0 = vm.privacy || {}, t0 = Math.floor(now());
  const st = { mode: p0.mode || 'link', pw: '', people: [], spaces: new Set(vm.spaces || []), startedSpaces: new Set(vm.spaces || []), withTime: false, panel: null };
  const link = () => `${base}/v/${id}${st.withTime && t0 ? `?t=${t0}` : ''}`;
  const m = $('modal'); m.hidden = false;
  const dirty = () => st.people.length || [...st.spaces].some((x) => !st.startedSpaces.has(x)) || [...st.startedSpaces].some((x) => !st.spaces.has(x)) || st.mode !== (p0.mode || 'link') || !!st.pw;
  const draw = () => {
    const a = ACCESS[st.mode], lockd = st.mode !== 'link';
    m.innerHTML = `<div class="box sm" role="dialog" aria-modal="true" aria-label="Share"><div class="hd"><h3>Share</h3><button class="lk ${st.panel === 'social' ? 'on' : ''}" data-p="social">${I('megaphone')}Social</button><button class="lk ${st.panel === 'embed' ? 'on' : ''}" data-p="embed">${I('embed')}Embed</button><button class="iconbtn" id="m-x" title="Close">${I('x')}</button></div>
    <div class="to"><input class="field" id="m-to" placeholder="Add names, emails, or Space" autocomplete="off"></div>
    ${st.people.length || st.spaces.size ? `<div class="got">${st.people.map((x, k) => `<span>${esc(x)}<button data-rp="${k}" title="Remove">${I('x')}</button></span>`).join('')}${spaces.filter((sp) => st.spaces.has(sp.id)).map((sp) => `<span>${I('users')}${esc(sp.name)}<button data-rs="${sp.id}" title="Remove">${I('x')}</button></span>`).join('')}</div>` : ''}
    ${spaces.filter((sp) => !st.spaces.has(sp.id)).length ? `<div class="sug">${spaces.filter((sp) => !st.spaces.has(sp.id)).map((sp) => `<button data-as="${sp.id}">${I('plus')}${esc(sp.name)}</button>`).join('')}</div>` : ''}
    <h5>General access</h5><div class="acc"><span class="tile ${lockd ? 'lockd' : ''}">${I(a[2])}</span><div><b id="m-acc">${a[0]}${I('down')}</b><small>${a[1]}</small></div></div>
    ${st.mode === 'password' ? `<div class="pwrow"><input class="field" type="password" id="m-pw" placeholder="${p0.hasPassword ? 'Leave empty to keep the current password' : 'Choose a password'}" value="${esc(st.pw)}"></div>` : ''}
    ${st.panel === 'embed' ? `<div class="more"><b style="font-size:14px">Embed in Notion, Zendesk, Intercom, Confluence or any site</b><code class="b" style="margin-top:10px">&lt;iframe src="${esc(base)}/embed/${id}" width="640" height="360" frameborder="0" allowfullscreen&gt;&lt;/iframe&gt;</code><button class="btn sm" id="m-ecopy" style="margin-top:10px">Copy embed code</button></div>` : ''}
    ${st.panel === 'social' ? `<div class="more"><div class="rowf" style="flex-wrap:wrap"><a class="btn" target="_blank" rel="noopener" href="https://x.com/intent/tweet?url=${encodeURIComponent(link())}&text=${encodeURIComponent(vm.title)}">Post on X</a><a class="btn" target="_blank" rel="noopener" href="https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(link())}">LinkedIn</a><a class="btn" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(vm.title + ' ' + link())}">WhatsApp</a></div>${s.lan ? '' : '<p class="note" style="margin:10px 0 0;color:var(--mute);font-size:13px">This link opens on this computer only. Turn on “People on my network” in Settings to share on your Wi-Fi.</p>'}</div>` : ''}
    <div class="ft"><button class="t" id="m-copy">${I('link')}Copy link</button><label class="t"><input type="checkbox" id="m-time" ${st.withTime ? 'checked' : ''}>Share video at ${fmt(t0)}</label><button class="t" id="m-lock">${I('lock')}Set password</button><button class="btn go ${dirty() ? 'pri' : ''}" id="m-go" ${dirty() ? '' : 'disabled'}>Share</button></div></div>`;
    wire();
  };
  const close = () => { m.hidden = true; document.removeEventListener('keydown', trap, true); opener?.focus(); };
  const opener = document.activeElement;
  const trap = (e) => { // U16: Esc closes, Tab stays inside the dialog
    if (e.key === 'Escape') { e.preventDefault(); close(); return; }
    if (e.key !== 'Tab') return;
    const f = [...m.querySelectorAll('button,input,select,a[href],textarea')].filter((x) => !x.disabled && x.offsetParent !== null); if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); } else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  };
  const addPerson = (txt) => {
    const t = txt.trim().replace(/,$/, ''); if (!t) return false;
    const sp = spaces.find((x) => x.name.toLowerCase() === t.toLowerCase()); if (sp) { st.spaces.add(sp.id); return true; }
    if (/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(t)) { if (!st.people.includes(t)) st.people.push(t); return true; }
    toast('Type an email address or the name of a Space'); return false;
  };
  function wire() {
    m.querySelector('#m-x').onclick = close; m.querySelectorAll('[data-p]').forEach((b) => (b.onclick = () => { st.panel = st.panel === b.dataset.p ? null : b.dataset.p; draw(); }));
    const to = m.querySelector('#m-to'); to.onkeydown = (e) => { if ((e.key === 'Enter' || e.key === ',') && to.value.trim()) { e.preventDefault(); if (addPerson(to.value)) { draw(); m.querySelector('#m-to').focus(); } } }; to.onblur = () => { if (to.value.trim() && addPerson(to.value)) draw(); };
    m.querySelectorAll('[data-rp]').forEach((b) => (b.onclick = () => { st.people.splice(+b.dataset.rp, 1); draw(); }));
    m.querySelectorAll('[data-rs]').forEach((b) => (b.onclick = () => { st.spaces.delete(b.dataset.rs); draw(); }));
    m.querySelectorAll('[data-as]').forEach((b) => (b.onclick = () => { st.spaces.add(b.dataset.as); draw(); }));
    m.querySelector('#m-acc').onclick = () => popover(m.querySelector('#m-acc'), Object.entries(ACCESS).map(([k, [n, d, ic]]) => `<button class="mi" data-m="${k}">${I(ic)}<span><b style="font-weight:600">${n}</b><br><small style="color:var(--mute)">${d}</small></span></button>`).join(''), (pp, c) => pp.querySelectorAll('[data-m]').forEach((b) => (b.onclick = () => { c(); st.mode = b.dataset.m; draw(); })));
    const pw = m.querySelector('#m-pw'); if (pw) pw.oninput = () => { st.pw = pw.value; m.querySelector('#m-go').disabled = !dirty(); m.querySelector('#m-go').classList.toggle('pri', dirty()); };
    m.querySelector('#m-copy').onclick = async (e) => { await navigator.clipboard.writeText(link()); copied(e.currentTarget); };
    m.querySelector('#m-time').onchange = (e) => { st.withTime = e.target.checked; };
    m.querySelector('#m-lock').onclick = () => { st.mode = 'password'; draw(); setTimeout(() => m.querySelector('#m-pw')?.focus(), 30); };
    if (m.querySelector('#m-ecopy')) m.querySelector('#m-ecopy').onclick = async (e) => { await navigator.clipboard.writeText(m.querySelector('code.b').textContent); copied(e.currentTarget); };
    m.querySelector('#m-go').onclick = async () => {
      if (to.value.trim()) addPerson(to.value);
      try {
        const body = { privacy: { mode: st.mode, password: st.pw || undefined }, spaces: [...st.spaces] };
        vm = await api(`/api/videos/${id}`, { method: 'PATCH', body }); ctl?.setVM(vm);
        if (st.people.length) window.open(`mailto:${st.people.join(',')}?subject=${encodeURIComponent(vm.title)}&body=${encodeURIComponent('Watch: ' + link())}`, '_self');
        close(); lastKey = ''; render(); toast('Shared');
      } catch (e) { toast(e.message); }
    };
  }
  m.onclick = (e) => { if (e.target === m) close(); };
  document.addEventListener('keydown', trap, true); draw(); m.querySelector('#m-to').focus();
}
boot();
</script></body></html>
