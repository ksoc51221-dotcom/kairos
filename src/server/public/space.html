<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Space · Spool</title><link rel="stylesheet" href="/static/app.css">
<style>main{max-width:1000px;margin:0 auto;padding:28px 24px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;margin-top:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:block}.th{aspect-ratio:16/9;background:#25232f center/cover}.meta{padding:10px 12px}.t{font-weight:600;font-size:14px}.s{font-size:12px;color:var(--mute);margin-top:3px}</style></head><body>
<div class="top"><a class="brand" href="/"><span class="logo"></span>Spool</a></div><main><h1 id="n"></h1><div class="grid" id="g"></div></main>
<script>
fetch('/api/space/' + location.pathname.split('/').pop()).then((r) => r.ok ? r.json() : Promise.reject()).then((s) => {
  document.getElementById('n').textContent = s.name; document.title = s.name + ' · Spool';
  document.getElementById('g').innerHTML = s.videos.map((v) => `<a class="card" href="/v/${v.id}"><div class="th" style="background-image:url('/media/${v.id}/thumb.jpg')"></div><div class="meta"><div class="t">${v.locked ? '🔒 ' : ''}${v.title.replace(/</g, '&lt;')}</div><div class="s">${v.views} views</div></div></a>`).join('') || '<p>Nothing here yet.</p>';
}).catch(() => (document.getElementById('n').textContent = 'Space not found'));
</script></body></html>
