<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spool</title><!--OG-->
<link rel="stylesheet" href="/static/app.css"><style>html,body{margin:0;height:100%;background:#000}.stage{border-radius:0;height:100%;aspect-ratio:auto}#root{height:100%}
#proc{position:absolute;inset:0;display:grid;place-items:center;color:#fff;background:#150f27;text-align:center;z-index:6}#proc[hidden]{display:none}
a.wm{position:absolute;left:10px;top:10px;font:700 12px -apple-system,sans-serif;color:#fff;background:rgba(35,25,66,.7);padding:5px 10px;border-radius:99px;z-index:5}</style></head><body>
<div id="root"><div class="stage" id="stage"><div id="zoomwrap"><video id="v" controls playsinline></video><div id="ov"></div></div><div id="cap"></div><a id="cta" hidden></a><a class="wm" id="wm" target="_blank">Spool</a><div id="proc" hidden></div></div></div>
<script src="/static/player.js"></script><script>
const { $, api, gateUI, attach } = SP; const id = location.pathname.split('/').pop();
(async () => {
  const me = await api('/api/me'); document.documentElement.style.setProperty('--accent', me.brand.accent);
  $('wm').hidden = me.brand.hideBranding; $('wm').textContent = me.brand.name; $('wm').href = `/v/${id}`;
  let vm; try { vm = await api(`/api/v/${id}`); } catch (e) { return gateUI($('root'), id, e, () => location.reload()); }
  if (vm.status !== 'ready') { $('proc').hidden = false; $('proc').textContent = 'Processing…'; setTimeout(() => location.reload(), 4000); return; }
  $('v').src = `/media/${id}/video.mp4`; $('v').poster = `/media/${id}/thumb.jpg`; attach({ stage: $('stage'), video: $('v'), vm, embed: true });
})();
</script></body></html>
