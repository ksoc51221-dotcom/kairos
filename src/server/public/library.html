<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spool</title><link rel="stylesheet" href="/static/app.css"><style>
body{display:grid;grid-template-columns:230px 1fr;grid-template-rows:auto 1fr;height:100vh}
.top{grid-column:1/3}
nav{background:var(--card);border-right:1px solid var(--line);padding:14px 10px;overflow:auto}
nav a,nav .nl{display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:9px;font-size:14px;color:var(--ink);cursor:pointer;justify-content:space-between}
nav a:hover{background:var(--bg)}nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav h6{margin:16px 11px 5px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);display:flex;justify-content:space-between;align-items:center}
nav h6 button{border:0;background:none;color:var(--accent);font-size:16px;cursor:pointer;line-height:1}
.bdg{background:var(--accent);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;font-weight:700}
main{overflow:auto;padding:26px 30px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:15px;margin:26px 0 10px}
#q{width:340px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative;transition:.15s;display:block}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(35,25,66,.14)}
.th{aspect-ratio:16/9;background:#25232f center/cover;position:relative}
.th .gif{position:absolute;inset:0;background:center/cover;opacity:0;transition:.2s}.card:hover .gif{opacity:1}
.dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.75);color:#fff;font:600 11px -apple-system,sans-serif;padding:2px 6px;border-radius:5px}
.tools{position:absolute;left:8px;top:8px;display:flex;gap:5px;opacity:0;transition:.15s}.card:hover .tools{opacity:1}
.tools button{border:0;background:rgba(35,25,66,.85);color:#fff;border-radius:7px;width:28px;height:28px;cursor:pointer;font-size:13px}
.lock{position:absolute;right:8px;top:8px;background:rgba(35,25,66,.85);color:#fff;border-radius:7px;padding:3px 7px;font-size:11px}
.meta{padding:10px 12px}.t{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.s{font-size:12px;color:var(--mute);margin-top:3px}
.proc{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:12px;background:rgba(35,25,66,.65)}
.empty{text-align:center;color:var(--mute);padding:60px 0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}.chip2{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px;font:600 12px -apple-system,sans-serif;cursor:pointer;color:var(--ink)}.chip2.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
#drop{position:fixed;inset:0;background:rgba(123,92,240,.85);color:#fff;display:none;place-items:center;font-size:26px;font-weight:700;z-index:90}
.panelx{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px;max-width:720px}
.panelx h3{margin:0 0 4px;font-size:15px}.panelx p.d{margin:0 0 12px;color:var(--mute);font-size:13px}
.fr{display:flex;gap:12px;align-items:center;margin:10px 0}.fr label{flex:0 0 170px;font-size:13px;font-weight:600}.fr input[type=text],.fr input[type=password],.fr input:not([type]),.fr select,.fr input[type=number]{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:13.5px;min-width:0}
.fr input[type=color]{width:44px;height:34px;border:0;background:none}.fr small{color:var(--mute);font-size:12px}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:14px 0}.stat div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}.stat b{display:block;font-size:26px}.stat span{font-size:12px;color:var(--mute)}
.bars{display:flex;align-items:flex-end;gap:6px;height:120px;margin:10px 0}.bars div{flex:1;background:linear-gradient(var(--accent),var(--mint));border-radius:4px 4px 0 0;position:relative;min-height:3px}.bars span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:10px;color:var(--mute)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--mute);font-weight:600}
.nt{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.nt.un{background:linear-gradient(90deg,var(--accent-soft),transparent)}.nt q{display:block;color:var(--mute);font-size:12.5px;margin-top:4px}
.warn{background:#fff6e5;color:#7a5200;border-radius:10px;padding:10px 14px;font-size:13px;margin:10px 0}@media (prefers-color-scheme:dark){.warn{background:#3a2c0a;color:#ffd685}}
</style></head><body>
<div class="top"><a class="brand" href="/"><span class="logo"></span><span id="bn">Spool</span></a><input id="q" placeholder="Search titles, transcripts, tags, people…"><div class="grow"></div><label class="btn" for="file">⬆ Upload video</label><input id="file" type="file" accept="video/*,.mkv,.avi,.mov" hidden></div>
<nav id="nav"></nav><main id="main"></main><div id="drop">Drop a video to add it to your library</div><div id="modal" class="modal" hidden></div>
<script>
const $ = (i) => document.getElementById(i), esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
const ago = (t) => { const m = (Date.now() - t) / 60000; return m < 1 ? 'just now' : m < 60 ? `${Math.floor(m)}m ago` : m < 1440 ? `${Math.floor(m / 60)}h ago` : `${Math.floor(m / 1440)}d ago`; };
const J = async (u, m, b) => { const r = await fetch(u, { method: m || (b ? 'POST' : 'GET'), headers: { 'content-type': 'application/json' }, body: b ? JSON.stringify(b) : undefined }); if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText); return r.status === 204 ? null : r.json().catch(() => null); };
let videos = [], folders = [], spaces = [], notifs = [], settings = {}, route = location.hash.slice(2) || 'home';

async function refresh() { [videos, folders, spaces, notifs] = await Promise.all([J('/api/videos'), J('/api/folders'), J('/api/spaces'), J('/api/notifications')]); renderNav(); }
function renderNav() {
  const un = notifs.filter((n) => !n.read).length, nav = (r, l, extra = '') => `<a href="#/${r}" class="${route === r ? 'on' : ''}"><span>${l}</span>${extra}</a>`;
  $('nav').innerHTML = nav('home', '🏠 Home') + nav('library', '📚 My Library') + nav('watchlater', '⏱ Watch later') + nav('recent', '🕘 Recently watched') + nav('unfinished', '▶ Unfinished') +
    `<h6>Folders <button id="addf" title="New folder">+</button></h6>` + folders.map((f) => nav('folder/' + f.id, '📁 ' + esc(f.name))).join('') +
    `<h6>Spaces <button id="adds" title="New space">+</button></h6>` + spaces.map((s) => nav('space/' + s.id, '👥 ' + esc(s.name))).join('') +
    `<h6>Workspace</h6>` + nav('notifications', '🔔 Notifications', un ? `<span class="bdg">${un}</span>` : '') + nav('insights', '📈 Insights') + nav('settings', '⚙ Settings');
  $('addf').onclick = async () => { const n = prompt('Folder name?'); if (n) { await J('/api/folders', 'POST', { name: n }); await refresh(); } };
  $('adds').onclick = async () => { const n = prompt('Space name? A space is a shareable page of videos.'); if (n) { await J('/api/spaces', 'POST', { name: n }); await refresh(); } };
}
const card = (v) => `<a class="card" href="/v/${v.id}"><div class="th" style="background-image:url('/media/${v.id}/thumb.jpg')">${v.hasGif ? `<div class="gif" style="background-image:url('/media/${v.id}/preview.gif')"></div>` : ''}
  ${v.status !== 'ready' ? `<div class="proc">${v.status === 'failed' ? 'Failed' : esc(v.stage || 'Processing') + '…'}</div>` : ''}
  <div class="tools"><button data-a="later" data-id="${v.id}" title="Watch later">${v.watchLater ? '★' : '☆'}</button><button data-a="del" data-id="${v.id}" title="Delete">🗑</button></div>
  ${v.privacy?.mode && v.privacy.mode !== 'link' ? `<span class="lock">🔒 ${v.privacy.mode}</span>` : ''}${v.type === 'image' ? '' : `<span class="dur">${fmt(v.duration)}</span>`}</div>
  <div class="meta"><div class="t">${esc(v.title)}</div><div class="s">${v.views} view${v.views === 1 ? '' : 's'} · ${ago(v.createdAt)}${v.tags?.length ? ' · #' + esc(v.tags[0]) : ''}</div></div></a>`;
const grid = (list, empty = 'Nothing here yet.') => list.length ? `<div class="grid">${list.map(card).join('')}</div>` : `<div class="empty">${empty}</div>`;
function wireCards() {
  document.querySelectorAll('.tools button').forEach((b) => (b.onclick = async (e) => { e.preventDefault(); e.stopPropagation(); const v = videos.find((x) => x.id === b.dataset.id);
    if (b.dataset.a === 'later') await J(`/api/videos/${v.id}`, 'PATCH', { watchLater: !v.watchLater }); else if (confirm(`Delete "${v.title}"?`)) await J(`/api/videos/${v.id}`, 'DELETE'); await refresh(); show(); }));
}
const matches = (v, q) => { const hay = `${v.title} ${v.transcript || ''} ${v.summary || ''} ${(v.tags || []).join(' ')} ${(v.viewers || []).map((x) => x.name + ' ' + x.email).join(' ')} ${v.comments.map((c) => c.author).join(' ')}`.toLowerCase(); return q.split(/\s+/).every((w) => hay.includes(w)); };

async function show() {
  route = location.hash.slice(2) || 'home'; renderNav(); const q = $('q').value.trim().toLowerCase(), m = $('main');
  if (q && !route.startsWith('settings')) { const r = videos.filter((v) => matches(v, q)); m.innerHTML = `<h1>Search</h1><div class="s chip">${r.length} result${r.length === 1 ? '' : 's'} for “${esc(q)}”</div><br>${grid(r, 'No matches.')}`; return wireCards(); }
  if (route === 'home') {
    const f = await J('/api/feed'); const sec = (t, l) => (l.length ? `<h2>${t}</h2>${grid(l)}` : '');
    m.innerHTML = `<h1>Welcome back</h1><div class="chip">Everything here is computed on this computer.</div>` + sec('Continue watching', f.unfinished) + sec('Trending this week', f.trending) + sec('Recommended for you', f.recommended) + sec('From tags you follow', f.following) + sec('Latest', f.latest) +
      (videos.length ? '' : '<div class="empty">No videos yet. Click ● Spool in your menu bar to record one, or upload a file.</div>');
  } else if (route === 'library') {
    const tags = [...new Set(videos.flatMap((v) => v.tags || []))].sort(), fol = settings.follows || [];
    m.innerHTML = `<h1>My Library</h1><div class="chips" id="tags">${tags.map((t) => `<button class="chip2 ${window._tag === t ? 'on' : ''}" data-t="${esc(t)}">#${esc(t)}</button>`).join('')}${window._tag ? `<button class="chip2" id="follow">${fol.includes(window._tag) ? '✓ Following' : '+ Follow'} #${esc(window._tag)}</button>` : ''}</div>` + grid(videos.filter((v) => !window._tag || (v.tags || []).includes(window._tag)), 'No videos yet.');
    document.querySelectorAll('#tags .chip2[data-t]').forEach((b) => (b.onclick = () => { window._tag = window._tag === b.dataset.t ? null : b.dataset.t; show(); }));
    if ($('follow')) $('follow').onclick = async () => { const s = await J('/api/settings'); const f = s.follows || []; const t = window._tag; await J('/api/settings', 'PUT', { follows: f.includes(t) ? f.filter((x) => x !== t) : [...f, t] }); settings.follows = null; settings = await J('/api/settings'); show(); };
  } else if (route === 'watchlater') m.innerHTML = '<h1>Watch later</h1>' + grid(videos.filter((v) => v.watchLater), 'Star a video to save it here.');
  else if (route === 'recent') m.innerHTML = '<h1>Recently watched</h1>' + grid(videos.filter((v) => v.lastWatchedAt).sort((a, b) => b.lastWatchedAt - a.lastWatchedAt), 'Videos you watch show up here.');
  else if (route === 'unfinished') m.innerHTML = '<h1>Unfinished</h1>' + grid(videos.filter((v) => v.progress > 3 && v.duration > 5 && v.progress < v.duration * 0.9), 'Nothing half-watched.');
  else if (route.startsWith('folder/')) { const f = folders.find((x) => x.id === route.split('/')[1]); m.innerHTML = `<h1>📁 ${esc(f?.name || 'Folder')}</h1><div class="chips"><button class="chip2" id="rn">Rename</button><button class="chip2" id="rm">Delete folder</button></div>` + grid(videos.filter((v) => v.folder === f?.id), 'Move videos here from the Share dialog.');
    $('rn').onclick = async () => { const n = prompt('New name?', f.name); if (n) { await J('/api/folders/' + f.id, 'PATCH', { name: n }); await refresh(); show(); } }; $('rm').onclick = async () => { if (confirm('Delete this folder? Videos stay in your library.')) { await J('/api/folders/' + f.id, 'DELETE'); location.hash = '#/library'; await refresh(); } }; }
  else if (route.startsWith('space/')) { const s = spaces.find((x) => x.id === route.split('/')[1]); const link = `${location.origin}/space/${s?.id}`;
    m.innerHTML = `<h1>👥 ${esc(s?.name || 'Space')}</h1><div class="chip">Shareable page: <a href="${link}" style="color:var(--accent)">${link}</a></div><div class="chips"><button class="chip2" id="cp">Copy link</button><button class="chip2" id="rm">Delete space</button></div>` + grid(videos.filter((v) => (v.spaces || []).includes(s?.id)), 'Add videos from the Share dialog.');
    $('cp').onclick = () => navigator.clipboard.writeText(link); $('rm').onclick = async () => { if (confirm('Delete this space?')) { await J('/api/spaces/' + s.id, 'DELETE'); location.hash = '#/library'; await refresh(); } }; }
  else if (route === 'notifications') {
    m.innerHTML = '<h1>Notifications</h1>' + (notifs.length ? notifs.map((n) => `<div class="nt ${n.read ? '' : 'un'}"><div style="flex:1"><b>${esc(n.by || 'Someone')}</b> ${n.type === 'comment' ? 'commented on' : n.type === 'mention' ? `mentioned <b>@${esc(n.to)}</b> on` : 'on'} <a href="/v/${n.videoId}?t=${Math.floor(n.t || 0)}" style="color:var(--accent);font-weight:600">${esc(n.title || 'a video')}</a> at ${fmt(n.t || 0)}${n.type === 'reaction' ? ' ' + esc(n.text) : ''}<br>${n.type !== 'reaction' ? `<span>“${esc(n.text)}”</span>` : ''}${n.snippet ? `<q>While you said: “${esc(n.snippet)}”</q>` : ''}</div><span class="chip">${ago(n.at)}</span></div>`).join('') : '<div class="empty">No notifications yet. Comments and reactions from viewers appear here.</div>');
    if (notifs.some((n) => !n.read)) { await J('/api/notifications/read', 'POST'); notifs.forEach((n) => (n.read = true)); setTimeout(renderNav, 400); }
  } else if (route === 'insights') renderInsights(m);
  else if (route === 'settings') renderSettings(m);
  wireCards();
}

async function renderInsights(m) {
  const d = await J('/api/insights'), mx = Math.max(1, ...d.byDay.map((x) => x.n)), mb = (b) => (b / 1048576).toFixed(b > 1e8 ? 0 : 1) + ' MB';
  m.innerHTML = `<h1>Insights</h1><div class="chip">Admin overview of this workspace</div><div class="stat"><div><b>${d.videos}</b><span>videos</span></div><div><b>${d.views}</b><span>views by others</span></div><div><b>${d.comments}</b><span>comments</span></div><div><b>${d.reactions}</b><span>reactions</span></div><div><b>${d.blurred}</b><span>secrets blurred</span></div><div><b>${mb(d.storage)}</b><span>on disk</span></div></div>
  <h2>Views, last 14 days</h2><div class="bars">${d.byDay.map((x) => `<div style="height:${(x.n / mx) * 100}%" title="${x.n}"><span>${x.day.slice(3)}</span></div>`).join('')}</div><br>
  <h2>Top videos</h2><table><tr><th>Video</th><th>Views</th></tr>${d.top.map((t) => `<tr><td><a href="/v/${t.id}">${esc(t.title)}</a></td><td>${t.views}</td></tr>`).join('') || '<tr><td colspan=2 class="chip">No data yet</td></tr>'}</table>
  <h2>People</h2><table><tr><th>Who</th><th>Views</th><th>Time watched</th></tr>${d.people.map((p) => `<tr><td>${esc(p.name)} <span class="chip">${esc(p.email)}</span></td><td>${p.views}</td><td>${fmt(p.watched)}</td></tr>`).join('') || '<tr><td colspan=3 class="chip">No viewers yet</td></tr>'}</table>
  <h2>Activity log</h2><table>${d.activity.map((a) => `<tr><td>${new Date(a.at).toLocaleString([], { dateStyle: 'short', timeStyle: 'short' })}</td><td>${esc(a.event)}</td><td>${esc(a.who || '')}</td><td>${esc(a.title || '')}</td></tr>`).join('')}</table>`;
}

async function renderSettings(m) {
  const s = (settings = await J('/api/settings')), b = s.brand, I = s.integrations || {}, mb = (x) => (x / 1048576).toFixed(1) + ' MB';
  const f = (label, html, hint = '') => `<div class="fr"><label>${label}</label>${html}</div>${hint ? `<div class="fr"><label></label><small>${hint}</small></div>` : ''}`;
  m.innerHTML = `<h1>Settings</h1>
  <div class="panelx"><h3>Profile & sharing</h3><p class="d">Spool runs on your computer. Links only work for people who can reach it.</p>
    ${f('Your name', `<input id="s-name" value="${esc(s.ownerName)}">`)}
    ${f('People on my network', `<input type="checkbox" id="s-lan" ${s.lan ? 'checked' : ''}>`, s.lan ? `Anyone on your Wi-Fi can open links at <b>http://${esc(s.lanIp || '?')}:${s.port}</b>. Only videos you shared are visible to them; the library and settings stay owner-only.` : 'Off: only this computer can open links. Turn on to share with colleagues on the same Wi-Fi.')}
    ${f('Default who can watch', `<select id="s-dp">${[['link', 'Anyone with the link'], ['email', 'Ask for email'], ['password', 'Password (set per video)'], ['private', 'Only me']].map(([k, l]) => `<option value="${k}" ${s.defaultPrivacy === k ? 'selected' : ''}>${l}</option>`).join('')}</select>`)}
    ${f('Links expire after', `<input id="s-exp" type="number" min="0" value="${s.linkExpiryDays}">`, 'Days. 0 means never.')}</div>
  <div class="panelx"><h3>Branding</h3><p class="d">Make the player yours.</p>
    ${f('Product name', `<input id="b-name" value="${esc(b.name)}">`)}${f('Accent colour', `<input type="color" id="b-acc" value="${esc(b.accent)}">`)}
    ${f('Logo', `<input type="file" id="b-logo" accept="image/png,image/jpeg">`, b.logo ? 'A logo is set.' : '')}${f('Hide product branding', `<input type="checkbox" id="b-hide" ${b.hideBranding ? 'checked' : ''}>`, 'Removes the name from the player header and embed watermark.')}</div>
  <div class="panelx"><h3>Privacy & security</h3><p class="d">Workspace-wide controls.</p>
    ${f('Privacy Guard', `<input type="checkbox" id="s-pg" ${s.privacyGuard ? 'checked' : ''}>`, 'Blur secrets and personal data before a video can be watched.')}
    ${f('Disable downloads', `<input type="checkbox" id="s-dd" ${s.disableDownloads ? 'checked' : ''}>`, 'Viewers cannot download any video. You still can.')}
    ${f('Delete videos after', `<input id="s-ret" type="number" min="0" value="${s.retentionDays}">`, 'Days. 0 keeps everything. Applies automatically, hourly.')}</div>
  <div class="panelx"><h3>AI</h3><p class="d">All models run locally through Ollama.</p>${f('Model', `<input id="s-model" value="${esc(s.model)}">`, 'Any model you have pulled, for example qwen3:8b.')}</div>
  <div class="panelx"><h3>Integrations</h3><p class="d">Tokens stay on this computer and are only sent to the service you configure.</p>
    ${f('Slack incoming webhook', `<input id="i-slack" type="password" placeholder="https://hooks.slack.com/services/…" value="${esc(I.slack?.hook || '')}">`)}
    ${f('GitHub repo (owner/name)', `<input id="i-ghr" value="${esc(I.github?.repo || '')}">`)}${f('GitHub token', `<input id="i-ght" type="password" placeholder="ghp_…" value="${esc(I.github?.token || '')}">`)}
    ${f('Linear API key', `<input id="i-lin" type="password" placeholder="lin_api_…" value="${esc(I.linear?.key || '')}">`)}${f('Linear team ID', `<input id="i-lint" value="${esc(I.linear?.teamId || '')}">`)}
    ${f('Jira site', `<input id="i-jsite" placeholder="yourcompany.atlassian.net" value="${esc(I.jira?.site || '')}">`)}${f('Jira email', `<input id="i-jmail" value="${esc(I.jira?.email || '')}">`)}${f('Jira API token', `<input id="i-jtok" type="password" value="${esc(I.jira?.token || '')}">`)}${f('Jira project key', `<input id="i-jkey" value="${esc(I.jira?.project || '')}">`)}</div>
  <div class="panelx"><h3>Your data</h3><p class="d">${mb(s.storage)} stored in the app's data folder on this computer. Nothing is uploaded anywhere.</p>
    <a class="btn" href="/api/export.json">Export library (JSON)</a> <button class="btn danger" id="wipe">Delete everything…</button></div>
  <div class="panelx"><h3>Security & compliance, honestly</h3><p class="d">What this local-first build does and does not claim.</p>
    <ul style="margin:0;padding-left:18px;line-height:1.7;font-size:13.5px"><li><b>Data residency:</b> your computer. No cloud region.</li><li><b>Access control:</b> owner = this machine; everyone else is a viewer limited by each link's privacy mode, passwords (scrypt-hashed), expiry and download rules.</li><li><b>Audit trail:</b> per-video activity log and a workspace log (Insights).</li><li><b>Not included:</b> SSO/SAML, SCIM and certifications such as SOC 2 or ISO 27001. A hosted team plan would need these.</li></ul></div>
  <div class="fr" style="max-width:720px;justify-content:flex-end"><span id="saved" class="chip"></span><button class="btn pri" id="save">Save settings</button></div>`;
  $('save').onclick = async () => {
    const v = (i) => $(i).value;
    try {
      await J('/api/settings', 'PUT', { ownerName: v('s-name'), lan: $('s-lan').checked, defaultPrivacy: v('s-dp'), linkExpiryDays: +v('s-exp') || 0, privacyGuard: $('s-pg').checked, disableDownloads: $('s-dd').checked, retentionDays: +v('s-ret') || 0, model: v('s-model'),
        brand: { name: v('b-name'), accent: v('b-acc'), hideBranding: $('b-hide').checked },
        integrations: { slack: { hook: v('i-slack') }, github: { repo: v('i-ghr'), token: v('i-ght') }, linear: { key: v('i-lin'), teamId: v('i-lint') }, jira: { site: v('i-jsite'), email: v('i-jmail'), token: v('i-jtok'), project: v('i-jkey') } } });
      const f = $('b-logo').files[0]; if (f) await fetch('/api/branding/logo', { method: 'PUT', body: f });
      $('saved').textContent = 'Saved ✓'; document.documentElement.style.setProperty('--accent', v('b-acc')); setTimeout(() => renderSettings($('main')), 600);
    } catch (e) { $('saved').textContent = e.message; }
  };
  $('wipe').onclick = async () => { if (prompt('This deletes every video. Type DELETE to confirm.') === 'DELETE') { await J('/api/data', 'DELETE', { confirm: 'DELETE' }); await refresh(); location.hash = '#/home'; } };
}

// Loomify: upload any video file by button or drag-and-drop
async function upload(file) {
  if (!file) return; $('main').insertAdjacentHTML('afterbegin', `<div class="warn" id="up">Uploading ${esc(file.name)}…</div>`);
  try { const r = await fetch(`/api/upload?name=${encodeURIComponent(file.name)}`, { method: 'PUT', body: file }); const d = await r.json(); if (!r.ok) throw new Error(d.error); location.href = `/v/${d.id}`; }
  catch (e) { $('up').textContent = 'Upload failed: ' + e.message; }
}
$('file').onchange = () => upload($('file').files[0]);
let dc = 0; addEventListener('dragenter', (e) => { if (e.dataTransfer.types.includes('Files')) { dc++; $('drop').style.display = 'grid'; } }); addEventListener('dragleave', () => { if (--dc <= 0) { dc = 0; $('drop').style.display = 'none'; } });
addEventListener('dragover', (e) => e.preventDefault()); addEventListener('drop', (e) => { e.preventDefault(); dc = 0; $('drop').style.display = 'none'; upload(e.dataTransfer.files[0]); });
$('q').oninput = show; addEventListener('hashchange', () => { $('q').value = ''; show(); });
(async () => { const me = await J('/api/me'); $('bn').textContent = me.brand.name; document.documentElement.style.setProperty('--accent', me.brand.accent); if (location.pathname === '/settings') location.hash = '#/settings'; settings = await J('/api/settings'); await refresh(); show(); setInterval(async () => { if (!document.hidden && !route.startsWith('settings')) { await refresh(); if (!$('q').value && !['settings', 'insights'].includes(route)) show(); } }, 5000); })();
</script></body></html>
