<nav id="nav"></nav>

<script>

    p.innerHTML = `<button class="btn ghost" style="width:100%;justify-content:flex-start" id="p-rec">${I('video')}Record a video</button><button class="btn ghost" style="width:100%;justify-content:flex-start" id="p-up">${I('upload')}Upload a video</button>`; document.body.appendChild(p);
    p.querySelector('#p-rec').onclick = () => { p.remove(); recordVideo(); }; p.querySelector('#p-up').onclick = () => { p.remove(); $('file').click(); };
    setTimeout(() => document.addEventListener('mousedown', function f(ev) { if (!p.contains(ev.target)) { p.remove(); document.removeEventListener('mousedown', f); } }));

const sel = (id, opts, cur) => `<select id="${id}" aria-label="${opts[0][1]}">${opts.map(([k, l]) => `<option value="${k}" ${k === cur ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
function filtered(list) {
  const day = 86400000, now = Date.now();
  let r = list.filter((v) => (F.tab === 'screenshots' ? v.type === 'image' : v.type !== 'image'));
  if (F.type) r = r.filter((v) => (F.type === 'upload' ? v.source === 'upload' : v.mode === F.type));
  if (F.act === 'comments') r = r.filter((v) => v.comments.length); else if (F.act === 'views') r = r.filter((v) => v.views > 0); else if (F.act === 'none') r = r.filter((v) => !v.views);
  if (F.date) r = r.filter((v) => now - v.createdAt < { today: day, week: 7 * day, month: 30 * day }[F.date]);
  r = r.slice().sort((a, b) => (F.sort === 'old' ? a.createdAt - b.createdAt : F.sort === 'views' ? b.views - a.views : F.sort === 'title' ? a.title.localeCompare(b.title) : b.createdAt - a.createdAt));
  return r;
}

// B17: what the AI needs, and a button to fetch the speech model once instead of failing silently offline
async function loadModels() {
  const el = $('models'); if (!el) return;
  try {
    const m = await J('/api/models'), sp = m.speech, d = sp.download || {}, mb = (b) => (b / 1048576).toFixed(0) + ' MB';
    const speech = sp.cached ? `<b>Speech (Whisper)</b> ready · ${mb(sp.bytes)}` : d.state === 'running' ? `<b>Speech (Whisper)</b> downloading… ${d.percent}%` : `<b>Speech (Whisper)</b> not downloaded yet (about 290 MB). Transcripts wait until it is.${d.state === 'error' ? ` <span style="color:var(--danger)">${esc(d.error)}</span>` : ''} <button class="btn sm" id="dlm">Download models</button>`;
    const sel = $('s-model');
    if (sel && m.ollama.installed?.length) { const cur = sel.value; sel.innerHTML = [...new Set([cur, ...m.ollama.installed])].map((n) => `<option value="${esc(n)}"${n === cur ? ' selected' : ''}>${esc(n)}${m.ollama.installed.includes(n) ? '' : ' (not installed)'}</option>`).join(''); }
    const miss = m.ollama.missing ? `<br><span style="color:var(--bad,#c0392b)">${esc(m.ollama.model)} is not installed. Run <code>ollama pull ${esc(m.ollama.model)}</code> or pick another model.</span>` : '';
    el.innerHTML = `<div style="font-size:14.5px;line-height:1.9">${speech}<br><b>Screen reading (OCR)</b> ${esc(m.ocr.engine)}<br><b>Notes model</b> ${m.ollama.available ? `Ollama is running (${esc(m.ollama.model)})` : 'Ollama is not running: titles, summaries and guides are skipped'}${miss}</div>`;
    if ($('dlm')) $('dlm').onclick = async () => { await J('/api/models/download', 'POST', {}); loadModels(); };
    if (d.state === 'running') setTimeout(() => { if (route === 'workspace') loadModels(); }, 1500);
  } catch (e) { el.innerHTML = `<span class="chip">${esc(e.message)}</span>`; }
}

// Loomify: upload any video file by button or drag-and-drop
async function upload(file) {
  if (!file) return;
  const u = { id: Math.random().toString(36).slice(2, 8), name: file.name, pct: 0 }; uploads.push(u); if (!['home', 'library'].includes(route)) location.hash = '#/library'; else show(true);
  const done = () => { uploads = uploads.filter((x) => x !== u); };
  try {
    const token = await window.spoolToken();
    await new Promise((resolve, reject) => {
      const x = new XMLHttpRequest(); x.open('PUT', `/api/upload?name=${encodeURIComponent(file.name)}`); x.setRequestHeader('x-spool-csrf', token);
      x.upload.onprogress = (e) => { if (e.lengthComputable) { u.pct = Math.round((e.loaded / e.total) * 100); show(true); } };
      x.onload = () => { let d = {}; try { d = JSON.parse(x.responseText); } catch {} x.status < 300 ? resolve(d.id) : reject(new Error(d.error || x.statusText)); };
      x.onerror = () => reject(new Error('connection lost')); x.send(file);
    });
    done(); await refresh(); show(true);
  } catch (e) { u.error = 'Upload failed: ' + e.message; show(true); setTimeout(() => { done(); show(true); }, 4000); }
}
$('file').onchange = () => upload($('file').files[0]);
let dc = 0; addEventListener('dragenter', (e) => { if (e.dataTransfer.types.includes('Files')) { dc++; $('drop').style.display = 'grid'; } }); addEventListener('dragleave', () => { if (--dc <= 0) { dc = 0; $('drop').style.display = 'none'; } });
addEventListener('dragover', (e) => e.preventDefault()); addEventListener('drop', (e) => { e.preventDefault(); dc = 0; $('drop').style.display = 'none'; upload(e.dataTransfer.files[0]); });

// U3: the server says when something changed; no 5 s timer. Updates are coalesced and rendered as a morph of the visible page.
let softTimer = null;
function liveUpdates() {
  const run = async () => { softTimer = null; if (document.hidden) return; await refresh(); if (!$('q').value && !['settings', 'workspace', 'insights', 'notifications'].includes(route)) show(true); };
  const kick = () => { if (!softTimer) softTimer = setTimeout(run, 120); };
  if (!window.EventSource) return void setInterval(kick, 8000);
  const es = new EventSource('/api/events'); es.addEventListener('video', kick); es.addEventListener('settings', () => { if (route === 'workspace') loadModels(); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) kick(); });
}
(async () => {

  if (location.pathname === '/settings') location.hash = '#/settings'; settings = await J('/api/settings'); await refresh(); show(); liveUpdates();
})();
