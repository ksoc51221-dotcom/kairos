<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;height:100%;background:rgba(0,0,0,.25);display:grid;place-items:center;overflow:hidden}
#n{font:800 220px -apple-system,sans-serif;color:#fff;text-shadow:0 8px 40px rgba(0,0,0,.5);animation:pop .9s ease-out}
@keyframes pop{0%{transform:scale(1.5);opacity:0}25%{opacity:1}100%{transform:scale(.85);opacity:.3}}
</style></head><body><div id="n">3</div>
<script>
const n = document.getElementById('n'); let c = 3;
const t = setInterval(() => {
  c--; if (c === 0) { clearInterval(t); spool.send('countdown:done'); return; }
  n.textContent = c; n.style.animation = 'none'; void n.offsetWidth; n.style.animation = '';
}, 900);
</script></body></html>
